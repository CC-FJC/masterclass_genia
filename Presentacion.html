        "detail": {
          "tag": "MATRIZ CAUSAL • ETAPA 3",
          "title": "3. LA CAUSALIDAD HUMANA Y TÉCNICA (CAUSA RAÍZ)",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Identificar el porqué de la conducta humana o del fallo del sistema. ¿Por qué el usuario sigue usando un método defectuoso? Suele haber una causa técnica (falta de instrumentos) entrelazada con una causa cultural (tradición heredada).\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Análisis de los 5 Porqués):</strong><br>\n                  • <em>Prompt de Causa Raíz Profunda:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Aplica la técnica de los 5 Porqués a este comportamiento de Sofía en la Tienda El Triunfo: solo atiende el WhatsApp cuando no hay fila en la tienda, así que los mensajes quedan horas sin responder y 6 mensajes quedaron sin contestar a las 7:00 p.m. Profundiza en barreras de tiempo (atiende sola mostrador + celular), hábitos (deja el celular boca abajo durante la fila), y restricciones del día a día (no puede contratar a alguien más, el presupuesto es de $150.000 COP).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Causa Raíz Caso Práctico:</strong>\n                  Sofía atiende sola el celular mientras atiende la fila de la tienda; cuando hay cola, los mensajes quedan sin responder por horas y el cliente se va a la competencia. Además, cada pedido vive en un papel distinto: no hay un solo registro central.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Reloj central con proporciones holgadas -->\n                  <circle cx=\"150\" cy=\"58\" r=\"32\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2.5\"/>\n                  <!-- Manecillas de reloj -->\n                  <line x1=\"150\" y1=\"58\" x2=\"150\" y2=\"38\" stroke=\"#ff622b\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n                  <line x1=\"150\" y1=\"58\" x2=\"168\" y2=\"58\" stroke=\"#ff622b\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n                  <circle cx=\"150\" cy=\"58\" r=\"3\" fill=\"#ff622b\"/>\n\n                  <!-- Caja de texto destacada inferior con amplio espacio -->\n                  <rect x=\"55\" y=\"104\" width=\"190\" height=\"28\" rx=\"5\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"123\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"18\" fill=\"#ff622b\" letter-spacing=\"1\">18 HORAS FIJAS</text>\n\n                  <text x=\"150\" y=\"152\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#475569\" letter-spacing=\"0.5\">SABER TRADICIONAL DESCALIBRADO</text>\n                </svg>\n                <span class=\"graphic-caption\">RAÍZ DEL COMPORTAMIENTO OBSERVADO</span>\n              </div>\n            </div>\n          "
        }

        "detail": {
          "tag": "MATRIZ CAUSAL • ETAPA 4",
          "title": "4. EL HALLAZGO (INSIGHT): LA PISTA DE INNOVACIÓN",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Un hallazgo no es un dato; es una interpretación o pista profunda. Revela una verdad humana que genera el momento '¡Eureka!'. Mientras los descubrimientos dicen qué pasa, el hallazgo abre una puerta hacia una solución que nadie había visto.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Destilación del Insight):</strong><br>\n                  • <em>Prompt de Generación de Insights:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Toma este descubrimiento: el 70% de los mensajes de WhatsApp de la Tienda El Triunfo son las mismas 5 preguntas (precio, existencia, horario, domicilios, medios de pago) y esta causa raíz: Sofía atiende sola el celular mientras atiende la fila, con un celular Android básico y sin datos a veces. Formula 3 posibles Insights usando la estructura: Sofía necesita responder rápido sin dejar la tienda porque teme perder clientes a la competencia, pero en realidad los pedidos se pierden por datos mal copiados en el cuaderno, lo que abre la oportunidad de un asistente de WhatsApp (Vitrina) que responda lo repetido, registre pedidos con dirección completa y recuerde las deudas.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Hallazgo Caso Práctico (Oportunidad):</strong>\n                  Si Sofía tuviera un asistente que responda solo lo repetido y le deje una lista clara del día —pedidos con dirección y clientes que deben— ella atendería el doble de clientes sin que se le olvide nada.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <circle cx=\"150\" cy=\"62\" r=\"34\" fill=\"#fef3c7\" stroke=\"#f59e0b\" stroke-width=\"2.5\"/>\n                  <text x=\"150\" y=\"74\" text-anchor=\"middle\" font-size=\"28\">💡</text>\n                  \n                  <path d=\"M 150 20 L 150 12\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n                  <path d=\"M 185 35 L 192 28\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n                  <path d=\"M 115 35 L 108 28\" stroke=\"#f59e0b\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n                  \n                  <rect x=\"40\" y=\"112\" width=\"220\" height=\"28\" rx=\"5\" fill=\"#f59e0b\"/>\n                  <text x=\"150\" y=\"130\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"16\" fill=\"#ffffff\" letter-spacing=\"0.5\">OPORTUNIDAD: RELOJ BIOLÓGICO</text>\n                  \n                  <text x=\"150\" y=\"156\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#78350f\">DEL PEDIDO OLVIDADO A LA VENTA SEGURA</text>\n                </svg>\n                <span class=\"graphic-caption\">EL MOMENTO 'EUREKA': DEL DOLOR AL VALOR</span>\n              </div>\n            </div>\n          "
        }

      "html": "<div class=\"template-doc\"><div class=\"card-meta-line\">\n          <h3 class=\"template-name\">PLANTILLA E.1: DESCUBRIMIENTOS Y HALLAZGOS</h3>\n          <span class=\"tag-badge-solid\">MATRIZ DE CAUSALIDAD</span>\n        </div>\n\n        <div class=\"template-instructions\">\n          <strong>Diferencia clave:</strong> El <em>Descubrimiento</em> es el hecho comprobado con evidencia dura (pesajes, facturas, temperatura). El <em>Hallazgo</em> es la interpretación profunda de por qué ocurre y qué oportunidad abre.\n        </div>\n\n        <div class=\"grid-4\">\n          <div>\n            <label class=\"field-tag\" for=\"e_evidencia\">1. Evidencia Cruda</label>\n            <textarea id=\"e_evidencia\" placeholder=\"Ej: Liquidaciones: 3 de 10 tanques cosechados con lluvia fueron liquidados con precio castigado de pasilla.\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"e_descubrimiento\">2. Descubrimiento (Hecho)</label>\n            <textarea id=\"e_descubrimiento\" placeholder=\"Ej: La masa cae a 14°C en la madrugada y desacelera la acidificación; el reloj de 18 horas ya no coincide con el punto de corte.\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"e_causal\">3. Causal (Por qué pasa)</label>\n            <textarea id=\"e_causal\" placeholder=\"Ej: El caficultor no tiene termómetro sumergible resistente y se guía únicamente por el tacto empírico.\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"e_hallazgo\">4. Hallazgo (Oportunidad)</label>\n            <textarea id=\"e_hallazgo\" placeholder=\"Ej: Si se instala una alarma sonora accionada por horas-grado térmicas, se eliminan los castigos de precio sin gastar en laboratorios.\"></textarea>\n          </div>\n        </div></div>"

        "body": "El aprendizaje consolidado de la investigación: datos, dolores y barreras validadas en el campo.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr19)'><path d='M70 20 H120 L138 38 V98 H70 Z'/><path d='M120 20 V38 H138'/><line x1='78' y1='48' x2='130' y2='48'/><line x1='78' y1='56' x2='130' y2='56'/><line x1='78' y1='64' x2='130' y2='64'/><line x1='78' y1='72' x2='130' y2='72'/><line x1='78' y1='80' x2='112' y2='80'/><path d='M108 90 l8 8 16 -18' stroke='#1f00ff' stroke-width='2.5'/></g><clipPath id='fr19'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "THE BRIEF • SECCIÓN 1",
          "title": "1. RESUMEN FACTUAL Y CONDICIONES DE ENTORNO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  The Brief es la brújula innegociable. No es un informe largo; es un contrato de una página que resume lo aprendido: el perfil del usuario, el dolor principal validado con datos y las condiciones del contexto territorial donde operará la solución.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Auditoría de Brief):</strong><br>\n                  • <em>Prompt de Auditoría Exigente:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Actúa como un director de diseño e innovación. Revisa este borrador de Brief de la Tienda El Triunfo: Resumen factual: tienda de barrio en municipio cafetero, 60% ventas en físico y 40% por WhatsApp, 30 clientes recurrentes al mes, pedidos en cuaderno y deudas en libreta, sin registro de inventario. Oportunidad: pasar de anotar en papel a un registro automático que no olvida nada. Limitantes: celular Android básico, a veces sin datos, presupuesto máximo $150.000 COP, debe funcionar sin luz. Delimitantes: NO se diseñará una app desde cero ni tienda virtual completa, solo organizar ventas por WhatsApp. Evalúa si es accionable, si tiene datos específicos o frases genéricas, y qué vacíos críticos resolver antes de ideación.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Resumen Factual Caso Práctico:</strong>\n                  Tienda de barrio en municipio cafetero: 60% de ventas en físico y 40% por WhatsApp, unos 30 clientes recurrentes al mes, pedidos en cuaderno y deudas en libreta, sin registro de inventario ni de ganancias reales.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"35\" y=\"25\" width=\"230\" height=\"135\" rx=\"8\" fill=\"#f8fafc\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <rect x=\"55\" y=\"45\" width=\"190\" height=\"18\" rx=\"3\" fill=\"#1f00ff\"/>\n                  <text x=\"150\" y=\"58\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\">CONTRATO DE DISEÑO: BRIEF</text>\n                  <line x1=\"55\" y1=\"80\" x2=\"245\" y2=\"80\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n                  <line x1=\"55\" y1=\"100\" x2=\"210\" y2=\"100\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n                  <line x1=\"55\" y1=\"120\" x2=\"230\" y2=\"120\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n                  <circle cx=\"230\" cy=\"135\" r=\"14\" fill=\"#ff622b\"/>\n                  <text x=\"230\" y=\"140\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#ffffff\">✓</text>\n                </svg>\n                <span class=\"graphic-caption\">DOCUMENTO GUÍA SINTÉTICO Y ACCIONABLE</span>\n              </div>\n            </div>\n          "
        }

      {
        "num": "02",
        "title": "OPORTUNIDAD DE CAMBIO",
        "body": "El cambio concreto y cuantificable que el proyecto debe provocar en la vida del usuario.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr20)'><path d='M50 88 A50 50 0 0 1 150 88'/><line x1='50' y1='88' x2='60' y2='88'/><line x1='150' y1='88' x2='140' y2='88'/><line x1='60' y1='66' x2='67' y2='70'/><line x1='100' y1='44' x2='100' y2='52'/><line x1='140' y1='66' x2='133' y2='70'/><line x1='75' y1='52' x2='81' y2='57'/><line x1='125' y1='52' x2='119' y2='57'/><line x1='100' y1='88' x2='128' y2='56' stroke='#1f00ff' stroke-width='2.5'/><circle cx='100' cy='88' r='5'/><line x1='40' y1='88' x2='160' y2='88'/><text x='100' y='104' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>impacto medible</text></g><clipPath id='fr20'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [

        "detail": {
          "tag": "THE BRIEF • SECCIÓN 2",
          "title": "2. LA OPORTUNIDAD DE CAMBIO E IMPACTO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Define con exactitud qué transformación se busca lograr. No describe la tecnología ('hacer una app'), sino el resultado medible ('eliminar el error humano en el punto de lavado').\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Fórmula de Transformación):</strong><br>\n                  • <em>Prompt de Enfoque de Impacto:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Ayúdame a redactar la oportunidad de cambio para la Tienda El Triunfo (Don Hernando y Sofía) asegurando que esté expresada en métricas de resultado de vida: que Sofía duerma tranquila sabiendo que ningún pedido se perdió y ninguna deuda quedó sin cobrar, aumentando las ventas por WhatsApp en un 20% en 90 días, sin contratar a nadie nuevo y sin dejar de atender la tienda.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Oportunidad Caso Práctico:</strong>\n                  Pasar de \"anotar en papel y recordar de memoria\" a vender con un registro automático al que no se le olvida nada, aumentando las ventas sin contratar más gente.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path d=\"M 45 130 Q 150 120 255 45\" fill=\"none\" stroke=\"#ff622b\" stroke-width=\"3\"/>\n                  <polygon points=\"255,40 262,52 248,50\" fill=\"#ff622b\"/>\n                  <circle cx=\"45\" cy=\"130\" r=\"5\" fill=\"#ef4444\"/>\n                  <circle cx=\"255\" cy=\"45\" r=\"6\" fill=\"#10b981\"/>\n                  <text x=\"45\" y=\"152\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#ef4444\">Estado Actual (Pérdida)</text>\n                  <text x=\"240\" y=\"30\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#10b981\">Meta: +35% Ingreso</text>\n                </svg>\n                <span class=\"graphic-caption\">SALTO CUALITATIVO Y CUANTIFICABLE</span>\n              </div>\n            </div>\n          "
        }
      },
      {
        "num": "03",
        "title": "LIMITANTES (BARRERAS)",
        "body": "Factores no negociables del entorno que no se pueden modificar: humedad 95%, sin internet, bajo presupuesto.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr21)'><rect x='50' y='30' width='100' height='66'/><line x1='50' y1='46' x2='150' y2='46'/><line x1='50' y1='62' x2='150' y2='62'/><line x1='50' y1='78' x2='150' y2='78'/><line x1='80' y1='30' x2='80' y2='46'/><line x1='110' y1='30' x2='110' y2='46'/><line x1='65' y1='46' x2='65' y2='62'/><line x1='95' y1='46' x2='95' y2='62'/><line x1='125' y1='46' x2='125' y2='62'/><line x1='80' y1='62' x2='80' y2='78'/><line x1='110' y1='62' x2='110' y2='78'/><line x1='65' y1='78' x2='65' y2='96'/><line x1='95' y1='78' x2='95' y2='96'/><line x1='125' y1='78' x2='125' y2='96'/><path d='M100 30 l-6 14 8 10 -10 16 6 12' stroke='#1f00ff' stroke-width='2'/></g><clipPath id='fr21'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [
          "Restricciones",
          "Fronteras"
        ],
        "detail": {
          "tag": "THE BRIEF • SECCIÓN 3",
          "title": "3. LIMITANTES: RESTRICCIONES DURAS DEL CONTEXTO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Las limitantes son las condiciones externas inevitables. Ignorarlas es la causa número uno de fracaso de proyectos sociales y de innovación. Si una idea requiere internet 5G donde no hay señal celular, esa idea nace muerta.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Stress Test de Contexto):</strong><br>\n                  • <em>Prompt de Detección de Fricciones Duras:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Para Vitrina, un asistente de ventas por WhatsApp usado en la Tienda El Triunfo (tienda de barrio con poco tiempo, celular Android básico de Sofía, a veces sin datos móviles, desconfianza de los clientes del barrio a dar datos bancarios por chat), lista 8 fallas de uso que un diseñador suele pasar por alto: 1) sin conexión a internet en la tienda, 2) celular con poca batería, 3) cliente manda audio en vez de texto, 4) cliente escribe mal el nombre del producto, 5) desconfianza a pagar por adelantado, 6) mensaje fuera de horario, 7) dos clientes con el mismo nombre, 8) Sofía no sabe configurar nada técnico.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Limitantes Caso Práctico:</strong>\n                  Sofía no es experta en tecnología; el celular del negocio es un Android básico; a veces no hay datos en la tienda; presupuesto máximo de $150.000 COP para empezar; y debe funcionar aunque se vaya la luz (con respaldo en papel).</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"50\" y=\"30\" width=\"200\" height=\"120\" rx=\"8\" fill=\"#fee2e2\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n                  <line x1=\"75\" y1=\"50\" x2=\"225\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"3\"/>\n                  <text x=\"150\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#b91c1c\">FRONTERAS INNEGOCIABLES</text>\n                  <text x=\"150\" y=\"105\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8.5\" fill=\"#7f1d1d\">SIN INTERNET • HUMEDAD EXTREMA</text>\n                </svg>\n                <span class=\"graphic-caption\">PARÁMETROS INFRANQUEABLES DEL ENTORNO</span>\n              </div>\n            </div>\n          "
        }

      {
        "num": "04",
        "title": "DELIMITANTES (ALCANCE)",
        "body": "Decisiones estratégicas conscientes del equipo sobre lo que NO se va a resolver en este ciclo.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr22)'><rect x='46' y='28' width='72' height='58' stroke='#a8a8a8' stroke-width='1.2' stroke-dasharray='4 3'/><line x1='122' y1='28' x2='142' y2='48' stroke='#1f00ff' stroke-width='2.5'/><line x1='142' y1='28' x2='122' y2='48' stroke='#1f00ff' stroke-width='2.5'/><circle cx='152' cy='80' r='6'/><circle cx='166' cy='92' r='6'/><line x1='156' y1='85' x2='174' y2='100'/><line x1='162' y1='87' x2='178' y2='98'/><text x='82' y='60' font-family='cursive' font-size='8' fill='#1f00ff' stroke='none' text-anchor='middle'>fuera de alcance</text></g><clipPath id='fr22'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "THE BRIEF • SECCIÓN 4",
          "title": "4. DELIMITANTES: EL ALCANCE DEFINIDO POR EL EQUIPO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Los delimitantes son los límites autoimpuestos por el equipo para mantener el foco. Definir lo que NO se va a hacer es tan importante como definir lo que sí. Evita el agrandamiento de alcance ('scope creep').\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Filtro Anti-Dispersión):</strong><br>\n                  • <em>Prompt de Acotamiento:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Revisa esta lista de funciones propuestas para Vitrina: 1) Responder las 5 preguntas frecuentes automáticamente, 2) Registrar cada pedido con nombre y dirección completa, 3) Llevar la cuenta de clientes fiados y avisar a Sofía a fin de mes, 4) Avisar cuándo se acaba un producto, 5) Enviar catálogo de productos con precios, 6) Hacer domicilios automáticos con mapa, 7) Conectar con pasarela de pagos, 8) Tener una app propia en Play Store. Separa lo que constituye el núcleo esencial (MVP: funciones 1, 2 y 3) de lo que debe declararse explícitamente fuera de alcance en esta fase (funciones 5, 6, 7 y 8: no se hará app propia, ni pasarela de pagos, ni domicilios automáticos con mapa).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Delimitantes Caso Práctico:</strong>\n                  En este ciclo NO diseñaremos una app desde cero ni una tienda virtual completa; el proyecto se enfoca 100% en organizar las ventas por WhatsApp que la tienda ya tiene.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"40\" y=\"30\" width=\"105\" height=\"115\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <text x=\"92\" y=\"55\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#1f00ff\">DENTRO (IN)</text>\n                  <text x=\"92\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">Asistente IA</text>\n                  <text x=\"92\" y=\"100\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">Respuesta automática</text>\n                  <text x=\"92\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">Alarma Sonora</text>\n\n                  <rect x=\"155\" y=\"30\" width=\"105\" height=\"115\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/>\n                  <text x=\"207\" y=\"55\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#64748b\">FUERA (OUT)</text>\n                  <text x=\"207\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#94a3b8\">Catálogo digital</text>\n                  <text x=\"207\" y=\"100\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#94a3b8\">App celular</text>\n                  <text x=\"207\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#94a3b8\">Química sintética</text>\n                </svg>\n                <span class=\"graphic-caption\">DELIMITACIÓN EXPLÍCITA DEL ALCANCE (IN / OUT)</span>\n              </div>\n            </div>\n          "
        }

      "html": "<div class=\"template-doc\"><div class=\"card-meta-line\">\n          <h3 class=\"template-name\">PLANTILLA E.2: THE BRIEF DEL PROYECTO</h3>\n          <span class=\"tag-badge-orange\">CONTRATO DE DISEÑO</span>\n        </div>\n\n        <div class=\"template-instructions\">\n          <strong>Regla de Oro:</strong> El Brief delimita lo que el proyecto DEBE cumplir (determinantes) y las restricciones que NO se pueden cambiar (limitantes).\n        </div>\n\n        <div class=\"grid-2\" style=\"margin-bottom: 16px;\">\n          <div>\n            <label class=\"field-tag\" for=\"e_brief_resumen\">1. Resumen de la Situación Investigada</label>\n            <textarea id=\"e_brief_resumen\" placeholder=\"Resume en un párrafo los hechos confirmados en campo sobre el problema y la pérdida de valor...\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"e_brief_oportunidad\">2. Oportunidad de Transformación (Verbo de cambio + Problema)</label>\n            <textarea id=\"e_brief_oportunidad\" placeholder=\"Ej: Estandarizar la fermentación anaeróbica para alcanzar >= 85 SCA + Deshidratar 100 kg/mes de cáscara para cafeterías de especialidad.\"></textarea>\n          </div>\n        </div>\n\n        <div class=\"grid-2\">\n          <div>\n            <label class=\"field-tag\" for=\"e_brief_determinantes\">3. Determinantes (Condiciones que DEBE cumplir la solución)</label>\n            <textarea id=\"e_brief_determinantes\" placeholder=\"Ej: • Operar 100% sin internet.&#10;• Limpieza rápida de mucílago en 10 segundos.&#10;• Inocuidad microbiológica para consumo humano.\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"e_brief_limitantes\" style=\"color: var(--color-danger);\">4. Limitantes (Restricciones inamovibles de presupuesto y entorno)</label>\n            <textarea id=\"e_brief_limitantes\" placeholder=\"Ej: • Presupuesto máximo: $150.000 COP por kit.&#10;• Adaptable a tanques plásticos existentes.&#10;• Piezas disponibles en ferreterías del municipio.\"></textarea>\n          </div>\n        </div></div>"

        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr23)'><circle cx='28' cy='60' r='5' fill='#1f00ff' stroke='none'/><circle cx='28' cy='60' r='8' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='2 3'/><line x1='33' y1='58' x2='164' y2='20'/><line x1='33' y1='59' x2='164' y2='40'/><line x1='33' y1='60' x2='164' y2='60' stroke='#a8a8a8' stroke-dasharray='3 3'/><line x1='33' y1='61' x2='164' y2='80'/><line x1='33' y1='62' x2='164' y2='100'/><circle cx='170' cy='20' r='4.5'/><circle cx='170' cy='40' r='4.5'/><circle cx='170' cy='60' r='4.5'/><circle cx='170' cy='80' r='4.5'/><g stroke='#1f00ff'><circle cx='170' cy='100' r='4.5'/></g><path d='M150 14 Q170 8 190 14' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 3'/></g><clipPath id='fr23'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "FASE N • PASO 1.1 • DIVERGENCIA",
          "title": "1. DIVERGENCIA EXPONENCIAL Y SUSPENSIÓN DEL JUICIO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Pautas para una buena sesión de ideación:<br>\n                  • <em>Evita juzgar las ideas:</em> En esta etapa, no descartes ninguna de entrada.<br>\n                  • <em>Explora más allá de lo obvio:</em> Las ideas salvajes suelen contener semillas viables.<br>\n                  • <em>Sé muy visual:</em> Dibujar y esquematizar ayuda a que las ideas cobren vida y conecten al equipo.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Copiloto de Ideación Divergente):</strong><br>\n                  • <em>Prompt de Divergencia Exponencial:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Basado en este reto HMW: \"¿Cómo podríamos lograr que la Tienda El Triunfo atienda, registre y haga seguimiento de sus ventas por WhatsApp sin que se le olvide nada y sin que Sofía tenga que dejar de atender la tienda?\" y estas restricciones del brief: celular Android básico, a veces sin datos, presupuesto máximo $150.000 COP, debe funcionar aunque se vaya la luz. Genera 15 ideas de solución divididas en 3 categorías: 1) Soluciones manuales de bajo costo (cuaderno con formato estándar, respuestas rápidas de WhatsApp Business, alarma para cobrar fiados), 2) Soluciones con WhatsApp e IA (Vitrina: asistente que responde lo repetido, registra pedidos y recuerda deudas), 3) Soluciones basadas en hábitos y alianzas del barrio (un joven del municipio que configura asistentes para varias tiendas, letrero en la tienda anunciando el asistente, grupo de WhatsApp de clientes VIP).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Salieron 42 ideas: desde un asistente que responde precios solo, hasta un cuaderno digital compartido, stickers con códigos QR en los productos, alarmas cuando se acaba un producto y un botón para agendar domicilios.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Doble Diamante con amplio margen -->\n                  <polygon points=\"30,85 105,30 105,140\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <polygon points=\"105,30 180,85 105,140\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2\"/>\n                  \n                  <text x=\"70\" y=\"88\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"14\" fill=\"#1f00ff\">DIVERGENCIA</text>\n                  <text x=\"140\" y=\"88\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"14\" fill=\"#ff622b\">CONVERGENCIA</text>\n                  \n                  <circle cx=\"230\" cy=\"85\" r=\"28\" fill=\"#1f00ff\"/>\n                  <text x=\"230\" y=\"90\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#ffffff\">IDEA TOP</text>\n                  <line x1=\"180\" y1=\"85\" x2=\"202\" y2=\"85\" stroke=\"#ff622b\" stroke-width=\"2\" stroke-dasharray=\"3,3\"/>\n                  \n                  <text x=\"150\" y=\"165\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#475569\">DOBLE DIAMANTE: ABRIR EL FOCO ANTES DE ELEGIR</text>\n                </svg>\n                <span class=\"graphic-caption\">EMBUDO METODOLÓGICO: CANTIDAD HACIA CALIDAD</span>\n              </div>\n            </div>\n          "

        "num": "02",
        "title": "SELECCIONAR Y PULIR",
        "body": "Técnica de Sombrero de Roles y Criterios de Selección: Impacto Real, Factibilidad Técnica y Viabilidad de Adopción.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr24)'><ellipse cx='55' cy='80' rx='22' ry='6'/><path d='M43 80 Q43 54 55 54 Q67 54 67 80'/><line x1='45' y1='70' x2='65' y2='70' stroke='#a8a8a8'/><ellipse cx='100' cy='80' rx='22' ry='6'/><path d='M88 80 Q88 50 100 50 Q112 50 112 80'/><line x1='90' y1='68' x2='110' y2='68' stroke='#1f00ff'/><ellipse cx='145' cy='80' rx='22' ry='6'/><path d='M133 80 Q133 54 145 54 Q157 54 157 80'/><line x1='135' y1='70' x2='155' y2='70' stroke='#a8a8a8'/><text x='55' y='44' font-family='cursive' font-size='7' fill='#777' stroke='none' text-anchor='middle'>crítico</text><text x='100' y='42' font-family='cursive' font-size='7' fill='#1f00ff' stroke='none' text-anchor='middle'>creativo</text><text x='145' y='44' font-family='cursive' font-size='7' fill='#777' stroke='none' text-anchor='middle'>práctico</text></g><clipPath id='fr24'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "FASE N • PASO 1.2 • SELECCIÓN",
          "title": "2. EVALUACIÓN MULTIANGULAR: SOMBREROS DE ROL Y CRITERIOS",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Tomar decisiones en grupo falla si todos piensan igual. La técnica de Sombrero de Roles asigna perspectivas forzadas (el optimista, el cauto/escéptico, el técnico lógico y el empático comunitario). Se complementa con una matriz de puntuación (Impacto, Factibilidad, Viabilidad).\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Sombrerero de Roles Sintético):</strong><br>\n                  • <em>Prompt de Sombreros de Pensamiento:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Actúa como un comité de evaluación con 3 personalidades evaluando la idea \"Vitrina: un asistente de ventas por WhatsApp con IA para la Tienda El Triunfo que responde las 5 preguntas frecuentes, registra cada pedido con dirección completa y lleva la cuenta de los fiados\": 1) Sombrero Negro (crítico feroz: ¿por qué fallaría? Sofía no sabe de tecnología, el celular es básico, a veces no hay datos, y si el cliente manda un audio?), 2) Sombrero Amarillo (optimista: en la prueba manual 9 de 10 pedidos se entregaron bien, las ventas subieron, se paga solo con recuperar 2 pedidos al mes), 3) Sombrero Azul (moderador: ajustes obligatorios = confirmar marca y dirección en el primer mensaje, soporte para audios, respuesta automática fuera de horario).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  El sombrero negro descartó \"una app propia\" porque Sofía no sabría instalarla ni pagar datos todo el día. Nació el requisito clave: tiene que funcionar dentro de WhatsApp, que ya usan todos los días.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"25\" y=\"30\" width=\"75\" height=\"95\" rx=\"6\" fill=\"#fef2f2\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n                  <text x=\"62\" y=\"55\" text-anchor=\"middle\" font-size=\"20\">🎩</text>\n                  <text x=\"62\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#b91c1c\">CAUTO</text>\n                  <text x=\"62\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#7f1d1d\">Riesgos y fallos</text>\n\n                  <rect x=\"112\" y=\"30\" width=\"75\" height=\"95\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"55\" text-anchor=\"middle\" font-size=\"20\">🧢</text>\n                  <text x=\"150\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#1f00ff\">LÓGICO</text>\n                  <text x=\"150\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#1e3a8a\">Factibilidad</text>\n\n                  <rect x=\"200\" y=\"30\" width=\"75\" height=\"95\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"237\" y=\"55\" text-anchor=\"middle\" font-size=\"20\">👒</text>\n                  <text x=\"237\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#15803d\">HUMANO</text>\n                  <text x=\"237\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#14532d\">Adopción real</text>\n\n                  <rect x=\"35\" y=\"140\" width=\"230\" height=\"22\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"155\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ffffff\">MATRIZ DE PUNTUACIÓN MULTICRITERIO</text>\n                </svg>\n                <span class=\"graphic-caption\">EVALUACIÓN DESDE PERSPECTIVAS POLARIZADAS</span>\n              </div>\n            </div>\n          "
        }
      },
      {
        "num": "03",
        "title": "PROPUESTA FINAL (P.V. Y P.S.)",
        "body": "Articulación formal: Propuesta de Valor (el 'qué' cambio generará) y Propuesta de Solución (el 'cómo' técnico lo logrará).",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr25)'><circle cx='82' cy='58' r='30'/><circle cx='118' cy='58' r='30'/><circle cx='82' cy='58' r='30' opacity='0.25' transform='translate(1,0.8)'/><path d='M100 34 A30 30 0 0 1 100 82 A30 30 0 0 1 100 34' stroke='#1f00ff' stroke-width='2'/><text x='70' y='62' font-family='cursive' font-size='9' fill='#777' stroke='none' text-anchor='middle'>QUÉ</text><text x='130' y='62' font-family='cursive' font-size='9' fill='#777' stroke='none' text-anchor='middle'>CÓMO</text><text x='100' y='61' font-family='cursive' font-size='8' fill='#1f00ff' stroke='none' text-anchor='middle'>PV</text></g><clipPath id='fr25'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [
          "Propuesta Valor",
          "Propuesta Solución",
          "Alineación"
        ],
        "detail": {
          "tag": "FASE N • PASO 1.3 • SÍNTESIS DE VALOR",
          "title": "3. ARTICULACIÓN CANÓNICA: P.V. (QUÉ) Y P.S. (CÓMO)",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Para que tu proyecto tenga impacto, debes definir claramente el cambio que provocará y cómo se logrará. Ambas deben estar perfectamente alineadas: la Propuesta de Valor define el 'qué' transformador y la Propuesta de Solución define el 'cómo' tecnológico.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Sintetizador P.V. / P.S.):</strong><br>\n                  • <em>Prompt de Fórmula de Valor:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Redacta en un párrafo conciso la Propuesta de Valor de Vitrina siguiendo la estructura: Ayudamos a Sofía y Don Hernando (tenderos de barrio) a lograr que ningún pedido se olvide y ningún fiado quede sin cobrar, durmiendo tranquilos y aumentando las ventas por WhatsApp, mediante un asistente dentro de WhatsApp que ya usan todos los días, eliminando el dolor histórico de anotar en cuaderno y recordar deudas en la cabeza. Luego redacta la Propuesta de Solución técnica en 3 viñetas operables: 1) Responde automáticamente las 5 preguntas frecuentes (precio, existencia, horario, domicilios, medios de pago), 2) Registra cada pedido con nombre, dirección completa y número de pedido visible, 3) Lleva la cuenta de quién debe y avisa a Sofía a fin de mes.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  • P.V. (qué): que ningún pedido se olvide y ningún fiado quede sin cobrar, sin que Sofía deje de atender la tienda. • P.S. (cómo): un asistente de ventas por WhatsApp con IA (\"Vitrina\") que responde lo repetido, registra cada pedido y cada deuda, y avisa qué reponer.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"25\" y=\"25\" width=\"115\" height=\"110\" rx=\"8\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <text x=\"82\" y=\"52\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#1f00ff\">QUÉ (VALOR)</text>\n                  <text x=\"82\" y=\"78\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">9 de 10 pedidos bien</text>\n                  <text x=\"82\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">Cero castigos</text>\n                  <text x=\"82\" y=\"118\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8\" fill=\"#10b981\">+35% Ingreso</text>\n\n                  <rect x=\"160\" y=\"25\" width=\"115\" height=\"110\" rx=\"8\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2\"/>\n                  <text x=\"217\" y=\"52\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#ff622b\">CÓMO (SOLUCIÓN)</text>\n                  <text x=\"217\" y=\"78\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">Registro de pedidos</text>\n                  <text x=\"217\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#1e293b\">Algoritmo biológico</text>\n                  <text x=\"217\" y=\"118\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8\" fill=\"#ff622b\">Vitrina: IA + WhatsApp</text>\n\n                  <rect x=\"40\" y=\"150\" width=\"220\" height=\"20\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"164\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#f8fafc\">ALINEACIÓN PERFECTA: EL QUÉ Y EL CÓMO</text>\n                </svg>\n                <span class=\"graphic-caption\">DUPLA CANÓNICA: PROPUESTA DE VALOR Y SOLUCIÓN</span>\n              </div>\n            </div>\n          "
        }

      "html": "<div class=\"template-doc\"><div class=\"card-meta-line\">\n          <h3 class=\"template-name\">PLANTILLA N.1: RECONFIGURAR IDEAS (SELECCIONAR Y PULIR)</h3>\n          <span class=\"tag-badge-solid\">LAS 9 TÉCNICAS CREATIVAS</span>\n        </div>\n\n        <div class=\"template-instructions\">\n          Aplica al menos 3 de las técnicas (Invertir, Integrar, Extender, Diferenciar, Adicionar, Sustraer, Trasladar, Adjuntar, Exagerar) para mutar la idea inicial y reducir costos.\n        </div>\n\n        <div class=\"grid-3\" style=\"margin-bottom: 14px;\">\n          <div>\n            <label class=\"field-tag\" for=\"n_reconfig_tec1\">Técnica Seleccionada 1 (Ej: Sustraer)</label>\n            <input type=\"text\" id=\"n_reconfig_tec1\" placeholder=\"Ej: SUSTRAER\">\n            <label class=\"field-tag\" style=\"margin-top: 8px;\" for=\"n_reconfig_desc1\">Cómo se transformó la idea</label>\n            <textarea id=\"n_reconfig_desc1\" placeholder=\"Ej: Se eliminó la pantalla LCD y el chip WiFi; se reemplazó por un timbre sonoro piezoeléctrico. Bajó el costo de $450.000 a $42.000 COP.\"></textarea>\n          </div>\n\n          <div>\n            <label class=\"field-tag\" for=\"n_reconfig_tec2\">Técnica Seleccionada 2 (Ej: Trasladar)</label>\n            <input type=\"text\" id=\"n_reconfig_tec2\" placeholder=\"Ej: TRASLADAR\">\n            <label class=\"field-tag\" style=\"margin-top: 8px;\" for=\"n_reconfig_desc2\">Cómo se transformó la idea</label>\n            <textarea id=\"n_reconfig_desc2\" placeholder=\"Ej: Se trasladaron las trampas de agua (airlocks) de la cerveza artesanal para medir escape de CO2 como sensor analógico de fermentación.\"></textarea>\n          </div>\n\n          <div>\n            <label class=\"field-tag\" for=\"n_reconfig_tec3\">Técnica Seleccionada 3 (Ej: Integrar)</label>\n            <input type=\"text\" id=\"n_reconfig_tec3\" placeholder=\"Ej: INTEGRAR\">\n            <label class=\"field-tag\" style=\"margin-           "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Preguntas de control innegociables:<br>\n                  1. ¿La idea resuelve el dolor medido en la Fase E?<br>\n                  2. ¿Cumple con la Oportunidad de Cambio declarada en el Brief?<br>\n                  3. Si la idea parece brillante pero no responde al reto HMW inicial, se descarta sin contemplación.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Juez de Prueba Ácida):</strong><br>\n                  • <em>Prompt de Prueba Ácida:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Compara esta propuesta de solución \"Vitrina: asistente de WhatsApp con IA que responde lo repetido, registra pedidos con dirección y recuerda deudas\" con el Brief original de la Tienda El Triunfo (dolor central: 4 pedidos perdidos por dirección mal copiada y $180.000 COP sin cobrar; limitantes: celular Android básico, sin datos a veces, máximo $150.000 COP, funciona sin luz con respaldo en papel; delimitantes: NO app propia, solo WhatsApp). Emite un veredicto binario (PASA / NO PASA) evaluando si responde al dolor central o si hubo desvío del foco.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Aprobación Caso Práctico:</strong>\n                  La propuesta de Vitrina ataca directamente los pedidos olvidados y las deudas sin cobrar, que causan la mayoría de las ventas perdidas de la tienda. Veredicto: PASA.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\           "title": "2. FILTRO DE LIMITANTES Y CONDICIONES DE BORDE",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Detectar ajustes críticos antes de gastar recursos:<br>\n                  • ¿La idea viola alguna limitante física del brief?<br>\n                  • Si requería conexión constante, se rediseña para funcionar con pocos datos y avisos por WhatsApp.<br>\n                  • Modificar la idea hasta que encaje sin forzar el contexto.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Stress Test de Viabilidad):</strong><br>\n                  • <em>Prompt de Filtro de Restricciones:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Evalúa la idea frente a estas 4 condiciones: 1) Celular Android básico, 2) Sin datos todo el día, 3) Poco tiempo entre fila y fila, 4) Presupuesto de $150.000 COP. Identifica los fallos de diseño y sugiere correcciones inmediatas.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Ajuste Caso Práctico:</strong>\n                  Se descartó que el asistente pida datos bancarios por el chat (los clientes del barrio desconfían); en su lugar confirma el pedido y deja el pago contra entrega o en la tienda.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"40\" y=\"25\" width=\"220\" height=\"135\" rx=\"8\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2\"/>\n                  <circle cx=\"150\" cy=\"65\" r=\"28\" fill=\"#ff622b\"/>\n                  <text x=\"150\" y=\"72\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight           "title": "1. LA PROPUESTA DE VALOR COMERCIAL Y SOCIAL",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  El Lean Canvas adapta el modelo de negocio al territorio. No busca hipótesis de Silicon Valley, sino viabilidad de adopción real en la comunidad campesina: ¿Por qué el productor cambiará su hábito de décadas por esta solución?\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Diseño de Modelo de Negocio Rural):</strong><br>\n                  • <em>Prompt de Lean Canvas Frugal:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Genera un Lean Canvas de 9 bloques para Vitrina (asistente de ventas por WhatsApp con IA) en tiendas de barrio del Eje Cafetero. Prioriza: Canales comunitarios (el WhatsApp que los clientes ya usan + letrero en la tienda + voz a voz entre tenderos del municipio), estructura de costos frugales (desde $0 con WhatsApp Business hasta $120.000 COP la versión automática), y métricas de adopción local (9 de 10 pedidos entregados bien, 100% de fiados cobrados, +20% ventas por WhatsApp en 90 días).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Propuesta de Valor Caso Práctico:</strong>\n                  \"Vitrina\" garantiza que 10 de cada 10 pedidos lleguen completos y que ningún fiado se olvide, aumentando las ventas del mes sin contratar a nadie nuevo.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"30\" y=\"25\" width=\"240\" height=\"135\" rx=\"8\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <rect x=\"45\" y=\"45\" width=\"210\" height=\"24\" rx=\"4\" fill=\"#1f00ff\"/>\n                  <text x=\"150\" y=\"61\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#ffffff\">PROPUESTA DE VALOR: VITRINA</text>\n\n                  <!-- 3 Cápsulas de métricas amplias -->\n                  <rect x=\"42\" y=\"86\" width=\"65\" height=\"38\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"74\" y=\"108\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"15\" fill=\"#ff622b\">+20% VENTAS</text>\n\n                  <rect x=\"117\" y=\"86\" width=\"65\" height=\"38\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"149\" y=\"108\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"15\" fill=\"#10b981\">+35% $</text>\n\n                  <rect x=\"192\" y=\"86\" width=\"68\" height=\"38\" rx=\"6\" fill=\"#fef2f2\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n                  <text x=\"226\" y=\"108\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"14\" fill=\"#ef4444\">0 CASTIGOS</text>\n\n                  <text x=\"150\" y=\"148\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#475569\">MÉTRICAS CLAVE DE IMPACTO EN EL PRODUCTOR</text>\n                </svg>\n                <span class=\"graphic-caption\">PROPUESTA DE VALOR COMERCIALIZABLE</span>\n              </div>\n            </div>\n"

          "tag": "LEAN CANVAS • BLOQUE SOLUCIÓN",
          "title": "2. LA SOLUCIÓN TÉCNICA: VITRINA A PRUEBA DE USO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  La solución técnica debe ser factible con materiales accesibles. La tecnología avanzada debe esconderse detrás de una interfaz extremadamente intuitiva que no requiera manual de usuario.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Diseño de Interfaces Campesinas):</strong><br>\n                  • <em>Prompt de UX sin Texto:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Diseña la interfaz de Vitrina (asistente de ventas por WhatsApp para la Tienda El Triunfo) que debe ser operada por Sofía, una tendera de 34 años con celular Android básico, poco tiempo entre fila y fila, y sin conocimientos técnicos. Cero menús de configuración: la interfaz es solo el chat de WhatsApp que ella ya usa. Los botones deben ser respuestas rápidas visibles (Precio, ¿Hay arroz?, Domicilio) y cada pedido debe confirmar automáticamente: ¿Pedido de arroz Diana x500g a la Calle 5 #12-34? Responde SÍ.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Solución Caso Práctico:</strong>\n                  Un asistente dentro de WhatsApp con IA: responde solo las preguntas repetidas (precio, existencia, domicilios, medios de pago), guarda cada pedido con nombre y dirección, lleva la cuenta de quién debe y avisa cuándo un producto se está acabando.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Esquema físico del dispositivo -->\n                  <rect x=\"135\" y=\"25\" width=\"30\"         "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr31)'><circle cx='100' cy='58' r='9' fill='#1f00ff' stroke='none'/><circle cx='100' cy='58' r='9' stroke='#3a3a3a'/><circle cx='42' cy='30' r='7'/><circle cx='158' cy='30' r='7'/><circle cx='38' cy='88' r='7'/><circle cx='162' cy='88' r='7'/><circle cx='100' cy='104' r='7'/><line x1='93' y1='52' x2='49' y2='35'/><line x1='107' y1='52' x2='151' y2='35'/><line x1='93' y1='64' x2='45' y2='84'/><line x1='107' y1='64' x2='155' y2='84'/><line x1='100' y1='67' x2='100' y2='97'/><line x1='49' y1='35' x2='151' y2='35' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='3 3'/><line x1='45' y1='84' x2='155' y2='84' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='3 3'/></g><clipPath id='fr31'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "LEAN CANVAS • BLOQUE CANALES",
          "title": "3. CANALES DE DISTRIBUCIÓN Y ADOPCIÓN TERRITORIAL",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  El mejor invento fracasa si no tiene un canal de distribución arraigado en la confianza comunitaria. En el comercio de barrio, depender de un solo canal es frágil; la adopción se logra a través de líderes del barrio y grupos de vecinos.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Estrategia Go-to-Market Rural):</strong><br>\n                  • <em>Prompt de Canales Asociativos:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Estructura un modelo de distribución para Vitrina en el municipio cafetero donde está la Tienda El Triunfo, aprovechando la red de tenderos del barrio: el canal principal es el WhatsApp del negocio que los clientes ya usan (CAC = $0), reforzado con un letrero en la tienda (Escríbenos, nuestro asistente te atiende al instante), y escalado con 2 jóvenes del municipio capacitados como configuradores de asistentes de ventas que ayuden a otras 10 tiendas del municipio a armar el suyo.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Canales Caso Práctico:</strong>\n                  Los clientes ya compran por el WhatsApp de la tienda: basta con que ese número sea el que atiende el asistente. Se promociona con un letrero en la tienda: \"Escríbenos, nuestro asistente te atiende al instante\".</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"30\" y=\"30\" width=\"105\" height=\"95\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#94a3b8\" stroke       "html": "<div class=\"template-doc\"><div class=\"card-meta-line\">\n          <h3 class=\"template-name\">PLANTILLA N.2: LEAN CANVAS (REPLICO Y AMPLÍO)</h3>\n          <span class=\"tag-badge-orange\">MODELO DE VALOR</span>\n        </div>\n\n        <div class=\"template-instructions\">\n          Sintetiza la propuesta asegurando que la <strong>Propuesta de Valor (el QUÉ)</strong> calce perfectamente con la <strong>Propuesta de Solución (el CÓMO)</strong> y los canales reales.\n        </div>\n\n        <div class=\"grid-lean\" style=\"margin-bottom: 16px;\">\n          <div>\n            <label class=\"field-tag\" for=\"n_canvas_problema\">1. Problema</label>\n            <textarea id=\"n_canvas_problema\" placeholder=\"¿Cuáles son las necesidades no resueltas de tus clientes y de tu finca?\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"n_canvas_solucion\">2. Propuesta de Solución (CÓMO)</label>\n            <textarea id=\"n_canvas_solucion\" placeholder=\"¿Qué características técnicas y herramientas maker componen la solución?\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"n_canvas_pv\">3. Propuesta de Valor (QUÉ)</label>\n            <textarea id=\"n_canvas_pv\" placeholder=\"¿En qué consiste el producto, por qué es único y para quién es útil?\"></textarea>\n          </div>\n        </div>\n\n        <div class=\"grid-3\">\n          <div>\n            <label class=\"field-tag\" for=\"n_canvas_segmentos\">4. Segmento de Clientes</label>\n            <textarea id=\"n_canvas_segmentos\" placeholder=\"¿Quiénes son los compradores dispuestos a pagar por el producto?\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"n_canvas_canales\">5. Canales de Distribución</label>\n            <textarea id=\"n_canvas_canales\" placeholder=\"¿Cómo llegarás a ellos? (Redes, venta directa, cafeterías aliadas)\"></textarea>\n         "detail": {
          "tag": "FASE I • PASO 1.1 • TIPOLOGÍAS DE PROTOTIPO",
          "title": "1. LAS CUATRO CLASES DE PROTOTIPOS DE IMPACTO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Dependiendo del recurso y de lo que se busca validar, existen 4 clases de prototipos:<br>\n                  1. <em>Bocetos rápidos en papel / Storyboards:</em> Visualizar la secuencia y el concepto básico.<br>\n                  2. <em>Simulación Mago de Oz:</em> El usuario cree que el sistema es automático, pero el equipo lo opera manualmente tras bambalinas.<br>\n                  3. <em>Maqueta física de cacharreo:</em> Construir con cartón, tubos de PVC y cinta para probar ergonomía y escala.<br>\n                  4. <em>Juego de rol experiencial:</em> Actuar la interacción para evaluar la reacción emocional del usuario.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Generación de Conceptos Visuales):</strong><br>\n                  • <em>Prompt para MidJourney / DALL-E / Runway:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Mockup de la interfaz de un asistente de ventas por WhatsApp: pantalla de celular con chat de pedidos automáticos, ambiente de tienda de barrio colombiana, render fotorealista, iluminación natural, 8k --ar 16:9.'</div><br>\n                  • <em>Prompt de Guión de Prototipado:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Diseña un guión paso a paso para construir en menos de 2 horas el prototipo de baja fidelidad de Vitrina en la Tienda El Triunfo usando solo: un celular viejo con WhatsApp Business gratuito, respuestas rápidas configuradas con las 5 preguntas frecuentes, una hoja de cálculo compartida en Google Sheets con los 30 clientes recurrentes, y un cuaderno de respaldo para cuando no haya luz. Sin comprar nada nuevo.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Se dibujó en papel el flujo de un pedido (el cliente escribe → el asistente responde → el pedido queda anotado) y se actuó una venta completa con un cliente real usando respuestas preparadas a mano.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- 3 Tipologías en tarjetas proporcionadas -->\n                  <rect x=\"20\" y=\"30\" width=\"80\" height=\"95\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"60\" y=\"55\" text-anchor=\"middle\" font-size=\"18\">📦</text>\n                  <text x=\"60\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#1f00ff\">FÍSICO</text>\n                  <text x=\"60\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Maqueta PVC</text>\n\n                  <rect x=\"110\" y=\"30\" width=\"80\" height=\"95\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"55\" text-anchor=\"middle\" font-size=\"18\">📱</text>\n                  <text x=\"150\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ff622b\">DIGITAL</text>\n                  <text x=\"150\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Mago de Oz</text>\n\n                  <rect x=\"200\" y=\"30\" width=\"80\" height=\"95\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"240\" y=\"55\" text-anchor=\"middle\" font-size=\"18\">🎭</text>\n                  <text x=\"240\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#15803d\">VIVENCIAL</text>\n                  <text x=\"240\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Juego de roles</text>\n\n                  <rect x=\"30\" y=\"140\" width=\"240\" height=\"22\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"155\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ffffff\">DIVERSIDAD DE FORMATOS SEGÚN HIPÓTESIS</text>\n                </svg>\n                <span class=\"graphic-caption\">TIPOLOGÍAS DE PROTOTIPADO RÁPIDO</span>\n              </div>\n            </div>\n          "
        }

        "detail": {
          "tag": "FASE I • PASO 1.2 • PIRÁMIDE DE FIDELIDAD",
          "title": "2. ESCALAMIENTO POR CAPAS: FALLAR RÁPIDO Y BARATO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Empieza construyendo prototipos de baja fidelidad y ve aumentando el nivel de detalle con cada iteración. ¿Qué es iterar? Probar, ajustar y repetir. Cada versión te acerca a una solución funcional alineada con la realidad comunitaria, minimizando el costo del error.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Diseño de Experimentos de Validación):</strong><br>\n                  • <em>Prompt de Matriz de Fidelidades:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Define qué aspectos específicos de Vitrina deben probarse en cada fidelidad: a) Baja fidelidad ($0 COP): respuestas rápidas de WhatsApp Business + hoja de cálculo compartida — probar si los clientes aceptan que les responda el asistente en vez de Sofía en persona; b) Media fidelidad ($30.000 COP): guion asistido por IA probado con 10 clientes — probar si responder en menos de 1 minuto hace que completen el pedido; c) Alta fidelidad ($120.000 COP): asistente automático dentro de WhatsApp operando una semana completa — probar que no se confundan pedidos y que Sofía confíe en el registro automático. Criterios de parada: si en baja fidelidad menos de 5 de 10 clientes completan el pedido, no se sube de fidelidad.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  • Baja ($0 COP): respuestas rápidas de WhatsApp Business + una hoja de cálculo compartida. • Media ($30.000 COP): guion de atención asistido por IA probado con 10 clientes. • Alta ($120.000 COP): asistente automático dentro de WhatsApp operando una semana completa.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Pirámide de fidelidades centrada y limpia -->\n                  <polygon points=\"150,25 90,80 210,80\" fill=\"#fef2f2\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"60\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#b91c1c\">ALTA (PILOTO)</text>\n\n                  <polygon points=\"90,80 60,120 240,120 210,80\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"105\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ff622b\">MEDIA (GUION CON IA)</text>\n\n                  <polygon points=\"60,120 30,155 270,155 240,120\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"142\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#1f00ff\">BAJA (CARTÓN, PVC, BOCETO)</text>\n\n                  <text x=\"150\" y=\"172\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8\" fill=\"#475569\">▲ MÁS COSTE / RESOLUCIÓN | ▼ MÁS VELOCIDAD / APRENDIZAJE</text>\n                </svg>\n                <span class=\"graphic-caption\">PIRÁMIDE DE FIDELIDAD PROGRESIVA</span>\n              </div>\n            </div>\n          "
        }

      {
        "num": "03",
        "title": "LOS 4 PASOS PARA INVENTAR",
        "body": "Paso A: Definir qué probar. Paso B: Construir rápido. Paso C: Probar con usuarios reales. Paso D: Ajustar e iterar.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr34)'><circle cx='100' cy='58' r='34' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='4 4'/><circle cx='100' cy='58' r='34' opacity='0.25' transform='translate(1,0.5)'/><circle cx='100' cy='24' r='7' fill='#1f00ff' stroke='none'/><circle cx='134' cy='58' r='7'/><circle cx='100' cy='92' r='7'/><circle cx='66' cy='58' r='7'/><polygon points='138,36 130,38 134,44' fill='#3a3a3a' stroke='none'/><polygon points='122,88 124,80 130,84' fill='#3a3a3a' stroke='none'/><polygon points='62,80 70,78 66,72' fill='#3a3a3a' stroke='none'/><polygon points='78,30 76,38 70,34' fill='#3a3a3a' stroke='none'/><text x='100' y='28' font-family='cursive' font-size='8' fill='#fff' stroke='none' text-anchor='middle'>1</text><text x='134' y='62' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>2</text><text x='100' y='96' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>3</text><text x='66' y='62' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>4</text></g><clipPath id='fr34'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

          "Paso a Paso",

        "detail": {
          "tag": "FASE I • PASO 1.3 • RUTA DE CONSTRUCCIÓN",
          "title": "3. RUTA METODOLÓGICA CANÓNICA DE INVENCIÓN",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Los 4 pasos ineludibles para inventar:<br>\n                  • <em>Paso A (Enfocar):</em> Elegir una hipótesis técnica o de adopción.<br>\n                  • <em>Paso B (Construir):</em> Materializar en el formato más ágil posible.<br>\n                  • <em>Paso C (Probar):</em> Observar al usuario en sesión 1 a 1 o co-creación sin asistirlo.<br>\n                  • <em>Paso D (Iterar):</em> Tabular fallas y reprogramar el siguiente prototipo.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Diseño de Sesiones de Testeo):</strong><br>\n                  • <em>Prompt de Protocolo de Testeo:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Actúa como un moderador de pruebas de usabilidad. Diseña un guión de observación de 5 pasos para testear Vitrina (Mago de Oz) en la Tienda El Triunfo sin inducir respuestas ni sesgar a los clientes: 1) Dile al cliente que están probando un asistente que atiende más rápido, 2) Observa en silencio cómo reacciona cuando la respuesta llega en segundos, 3) No intervengas durante la conversación por WhatsApp, 4) Al finalizar, pregunta solo cómo te sentiste con la rapidez de la respuesta, 5) Anota si completó el pedido o se fue a la tienda de enfrente.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  En la primera prueba un cliente escribió \"mándeme dos de arroz\" y la respuesta automática preguntó \"¿de qué marca?\"; el cliente se fue sin comprar. Se ajustó el guion para confirmar marca y dirección ya en el primer mensaje.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- 4 pasos en ciclo con amplio espacio -->\n                  <rect x=\"25\" y=\"30\" width=\"115\" height=\"48\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"82\" y=\"50\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#1f00ff\">PASO A: ENFOCAR</text>\n                  <text x=\"82\" y=\"66\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Definir qué probar</text>\n\n                  <rect x=\"160\" y=\"30\" width=\"115\" height=\"48\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"217\" y=\"50\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ff622b\">PASO B: CONSTRUIR</text>\n                  <text x=\"217\" y=\"66\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Materializar rápido</text>\n\n                  <rect x=\"160\" y=\"95\" width=\"115\" height=\"48\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"217\" y=\"115\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#15803d\">PASO C: PROBAR</text>\n                  <text x=\"217\" y=\"131\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Test in situ con usuario</text>\n\n                  <rect x=\"25\" y=\"95\" width=\"115\" height=\"48\" rx=\"6\" fill=\"#faf5ff\" stroke=\"#7c3aed\" stroke-width=\"1.5\"/>\n                  <text x=\"82\" y=\"115\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#7c3aed\">PASO D: ITERAR</text>\n                  <text x=\"82\" y=\"131\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Ajustar y repetir</text>\n\n                  <text x=\"150\" y=\"165\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#0f172a\">CICLO METODOLÓGICO CONTINUO: A → B → C → D</text>\n                </svg>\n                <span class=\"graphic-caption\">SECUENCIA CANÓNICA DE INVENCIÓN GENIA</span>\n              </div>\n            </div>\n          "
        }
      }
