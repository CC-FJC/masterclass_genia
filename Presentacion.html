        "detail": {
          "tag": "MAGO DE OZ • FRONT-END",
          "title": "1. LA EXPERIENCIA DEL USUARIO (ILUSIÓN PERFECTA)",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  El método 'Mago de Oz' permite validar el valor de una solución tecnológica compleja antes de escribir una sola línea de código o fabricar circuitos avanzados. El usuario interactúa con la interfaz tal como será en el futuro, permitiendo medir su disposición a confiar y actuar ante los avisos.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Simulador de Asistente):</strong><br>\n                  • <em>Prompt de Mago de Oz con IA:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Actúa como el motor de respuestas de Vitrina, el asistente de ventas por WhatsApp de la Tienda El Triunfo. Cuando un cliente ingrese: ¿a cuánto está el arroz?, genera un mensaje en lenguaje campesino cálido y directo de Sofía: Hola, el arroz Diana de 500g está a $4.500. ¿Lo encargo para entrega hoy?. Si el cliente ingresa ¿hacen domicilios?: Sí, en moto por todo el barrio, $2.000 el domicilio, gratis desde $30.000.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  A 5 clientes frecuentes se les dijo: \"estamos probando un asistente que atiende más rápido\". Durante una tarde, cada mensaje fue respondido en segundos como si fuera automático; los clientes quedaron sorprendidos con la rapidez.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Teléfono y aviso de Mago de Oz -->\n                  <rect x=\"70\" y=\"20\" width=\"160\" height=\"145\" rx=\"10\" fill=\"#f8fafc\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <rect x=\"85\" y=\"45\" width=\"130\" height=\"65\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"65\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9.5\" fill=\"#1f00ff\">AVISO DE ALERTA</text>\n                  <text x=\"150\" y=\"85\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#ff622b\">\"Lave en 45 min\"</text>\n                  <text x=\"150\" y=\"100\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#475569\">Pedido completo</text>\n\n                  <circle cx=\"150\" cy=\"135\" r=\"14\" fill=\"#10b981\"/>\n                  <text x=\"150\" y=\"140\" text-anchor=\"middle\" font-size=\"12\">👍</text>\n\n                  <text x=\"150\" y=\"172\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8\" fill=\"#475569\">EL USUARIO CONFÍA Y ACTÚA DE INMEDIATO</text>\n                </svg>\n                <span class=\"graphic-caption\">FRONT-END: EXPERIENCIA DEL USUARIO EN CAMPO</span>\n              </div>\n            </div>\n          "

        "detail": {
          "tag": "MAGO DE OZ • BACK-END",
          "title": "2. LA OPERACIÓN HUMANA ENTRE BASTIDORES",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Detrás de la cortina, el equipo ejecuta manualmente todos los procesos que en el producto final serán automatizados por software y sensores. Esto permite comprobar si el algoritmo humano funciona antes de gastar meses programándolo.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Calculadora de Grados-Hora):</strong><br>\n                  • <em>Prompt de Cálculo Fisiológico:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Actúa como el analista de ventas de la Tienda El Triunfo. Dada la lista de mensajes de WhatsApp de una semana de octubre (40 mensajes/día en promedio: 32 son ¿a cuánto está el arroz?, ¿tienen pan?, ¿hasta qué hora atienden?, ¿hacen domicilios?, ¿reciben transferencia?, y 8 son pedidos puntuales), dime las 5 preguntas más repetidas, los horarios pico de pedidos (7:00-9:00 a.m. y 5:00-8:00 p.m.), y cuántos mensajes quedaron sin responder (6 el miércoles a las 7:00 p.m.).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Operación Oculta Caso Práctico:</strong>\n                  Sofía, desde otro celular con una segunda cuenta, respondía manualmente cada mensaje usando una plantilla escrita. Costo del \"desarrollo\": $0 COP. Aprendizaje validado: los clientes sí compran más cuando les responden al instante.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Mago detrás de la cortina -->\n                  <rect x=\"35\" y=\"25\" width=\"230\" height=\"135\" rx=\"8\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2\"/>\n                  <rect x=\"55\" y=\"45\" width=\"190\" height=\"24\" rx=\"4\" fill=\"#ff622b\"/>\n                  <text x=\"150\" y=\"61\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#ffffff\">OPERACIÓN TRAS BAMBALINAS</text>\n\n                  <circle cx=\"95\" cy=\"105\" r=\"22\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"95\" y=\"110\" text-anchor=\"middle\" font-size=\"16\">👨‍🔬</text>\n\n                  <line x1=\"125\" y1=\"105\" x2=\"175\" y2=\"105\" stroke=\"#ff622b\" stroke-width=\"2\" stroke-dasharray=\"3,3\"/>\n                  <polygon points=\"172,100 182,105 172,110\" fill=\"#ff622b\"/>\n\n                  <circle cx=\"205\" cy=\"105\" r=\"22\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"205\" y=\"110\" text-anchor=\"middle\" font-size=\"16\">📊</text>\n\n                  <text x=\"150\" y=\"148\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#7c2d12\">CÁLCULO MANUAL Y DESPACHO DE ALERTA</text>\n                </svg>\n                <span class=\"graphic-caption\">BACK-END: VALIDACIÓN MANUAL DE ALGORITMOS</span>\n              </div>\n            </div>\n          "

        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr37)'><path d='M50 88 A50 50 0 0 1 150 88'/><path d='M50 88 A50 50 0 0 1 150 88' opacity='0.25' transform='translate(1,0.8)'/><line x1='40' y1='88' x2='160' y2='88'/><line x1='60' y1='66' x2='67' y2='70'/><line x1='100' y1='44' x2='100' y2='52'/><line x1='140' y1='66' x2='133' y2='70'/><line x1='75' y1='52' x2='81' y2='57'/><line x1='125' y1='52' x2='119' y2='57'/><path d='M118 52 A50 50 0 0 1 150 88' stroke='#1f00ff' stroke-width='2.5'/><line x1='100' y1='88' x2='122' y2='60' stroke='#1f00ff' stroke-width='2.5'/><circle cx='100' cy='88' r='5'/><text x='100' y='104' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>métrica binaria</text></g><clipPath id='fr37'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "MATRIZ DE ITERACIÓN • COLUMNA 1",
          "title": "1. DECLARACIÓN DE HIPÓTESIS Y MÉTRICA DE ÉXITO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Una prueba no sirve si no tiene una hipótesis falsable formulada con antelación. La estructura canónica es: 'Creemos que [acción del sistema] provocará [comportamiento del usuario], lo cual validaremos si [métrica observable].'\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Diseñador de Hipótesis Falsables):</strong><br>\n                  • <em>Prompt de Hipótesis Científica:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Transforma esta idea de mejora de Vitrina en 3 hipótesis comprobables en campo: 1) Creemos que responder en menos de 1 minuto los mensajes de WhatsApp hará que al menos 8 de cada 10 clientes completen su pedido en vez de irse a la tienda de enfrente. 2) Creemos que asignar un número de pedido visible (Pedido #12) evitará que se confundan dos clientes con el mismo nombre y reducirá a cero las entregas en dirección equivocada. 3) Creemos que una respuesta automática fuera de horario (te atendemos desde las 7:00 a.m.) hará que ningún mensaje quede sin responder después de las 7:00 p.m. y recuperará al menos 3 ventas por semana.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Hipótesis Caso Práctico:</strong>\n                  Creemos que responder en menos de 1 minuto los mensajes de WhatsApp logrará que al menos 8 de cada 10 clientes completen su pedido en lugar de irse a la tienda de enfrente.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"35\" y=\"25\" width=\"230\" height=\"135\" rx=\"8\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"2\"/>\n                  <rect x=\"55\" y=\"45\" width=\"190\" height=\"24\" rx=\"4\" fill=\"#1f00ff\"/>\n                  <text x=\"150\" y=\"61\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9.5\" fill=\"#ffffff\">HIPÓTESIS DE IMPACTO</text>\n\n                  <circle cx=\"150\" cy=\"100\" r=\"26\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2\"/>\n                  <text x=\"150\" y=\"106\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"16\" fill=\"#ff622b\">8 DE 10</text>\n\n                  <text x=\"150\" y=\"145\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#475569\">MÉTRICA DE ACEPTACIÓN CUANTITATIVA</text>\n                </svg>\n                <span class=\"graphic-caption\">FORMULACIÓN DE HIPÓTESIS CUANTIFICABLE</span>\n              </div>\n            </div>\n          "
        }

        "title": "REGISTRO DE FALLAS (✗)",
        "body": "Documentación implacable de fallas: 6 mensajes sin responder a las 7:00 p.m. y dos pedidos confundidos por clientes con el mismo nombre.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr38)'><rect x='66' y='24' width='68' height='72' rx='3'/><rect x='66' y='24' width='68' height='72' rx='3' opacity='0.25' transform='translate(1,0.8)'/><circle cx='66' cy='34' r='2.5'/><circle cx='66' cy='46' r='2.5'/><circle cx='66' cy='58' r='2.5'/><circle cx='66' cy='70' r='2.5'/><circle cx='66' cy='82' r='2.5'/><line x1='76' y1='40' x2='126' y2='40'/><line x1='76' y1='52' x2='126' y2='52'/><line x1='76' y1='64' x2='126' y2='64'/><line x1='76' y1='76' x2='126' y2='76'/><line x1='76' y1='88' x2='112' y2='88'/><g stroke='#1f00ff' stroke-width='2'><line x1='86' y1='46' x2='94' y2='54'/><line x1='94' y1='46' x2='86' y2='54'/><line x1='106' y1='60' x2='114' y2='68'/><line x1='114' y1='60' x2='106' y2='68'/><line x1='92' y1='74' x2='100' y2='82'/><line x1='100' y1='74' x2='92' y2='82'/></g></g><clipPath id='fr38'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "MATRIZ DE ITERACIÓN • COLUMNA 2",
          "title": "2. REGISTRO DOCUMENTAL DE FRACASOS Y DESCALIBRACIONES",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  El secreto del éxito está en probar, ajustar y volver a probar. El fracaso en una prueba de prototipo no es una derrota; es el dato más valioso del proceso. Si un prototipo no falla en nada, significa que la prueba fue superficial.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Post-Mortem de Pruebas):</strong><br>\n                  • <em>Prompt de Matriz de Feedback:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Aquí están mis notas de la prueba de una semana de Vitrina en la Tienda El Triunfo: \"Lunes: 8 mensajes respondidos en menos de 1 min, 7 pedidos completados\", \"Martes: se confundieron dos pedidos de la señora del corner, casi se entrega en dirección equivocada\", \"Miércoles: a las 7:00 p.m. quedaron 6 mensajes sin responder, Sofía ya no alcanzaba\", \"Jueves: un cliente escribió mándeme dos de arroz y la respuesta automática preguntó ¿de qué marca? y el cliente se fue sin comprar\", \"Viernes: con número de pedido visible (Pedido #12) y confirmación de marca y dirección en el primer mensaje, 9 de 10 pedidos se entregaron bien\". Organízalas en los 4 cuadrantes GENIA: 1) ¿Qué funcionó? (respuesta en menos de 1 min, pedido # visible), 2) ¿Qué falló? (confusión de nombres, mensajes sin responder a las 7 p.m., cliente se va si pregunta marca después), 3) ¿Qué preguntas surgieron? (y si manda audio?), 4) ¿Ideas del usuario? (que me avise cuando se acabe el pan).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Fallas Caso Práctico (Día 4):</strong>\n                  El asistente manual confundió los pedidos de dos clientes con el mismo nombre (\"la señora del corner\") y casi se entrega en la dirección equivocada; además, a las 7:00 p.m. Sofía ya no alcanzaba a responder y quedaron 6 mensajes sin contestar.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"35\" y=\"25\" width=\"230\" height=\"135\" rx=\"8\" fill=\"#fef2f2\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n                  <circle cx=\"150\" cy=\"65\" r=\"26\" fill=\"#ef4444\"/>\n                  <text x=\"150\" y=\"73\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"20\" fill=\"#ffffff\">✗</text>\n\n                  <rect x=\"50\" y=\"105\" width=\"200\" height=\"22\" rx=\"4\" fill=\"#ffffff\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n                  <text x=\"150\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ef4444\">ALARMA INAUDIBLE • CORROSIÓN COBRE</text>\n\n                  <text x=\"150\" y=\"146\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#7f1d1d\">HALLAZGO CRÍTICO EN CONDICIONES EXTREMAS</text>\n                </svg>\n                <span class=\"graphic-caption\">REGISTRO DE FALLAS EN CONDICIONES EXTREMAS</span>\n              </div>\n            </div>\n          "
        }

        "num": "03",
        "title": "REFINAMIENTO APLICADO (✓)",
        "body": "Ajuste en la siguiente versión: confirmar marca y dirección en el primer mensaje y responder automáticamente fuera de horario.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr39)'><path d='M58 82 A42 26 0 1 1 142 82' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='4 3'/><polygon points='142,82 134,78 136,86' fill='#a8a8a8' stroke='none'/><line x1='66' y1='90' x2='106' y2='50'/><line x1='66' y1='90' x2='106' y2='50' opacity='0.25' transform='translate(1,1)'/><polygon points='106,50 114,42 110,54' fill='#3a3a3a' stroke='none'/><rect x='122' y='66' width='24' height='13' rx='2' transform='rotate(-20 134 72)'/><line x1='126' y1='70' x2='146' y2='64' stroke='#1f00ff' stroke-width='1.5'/><text x='100' y='30' font-family='cursive' font-size='9' fill='#1f00ff' stroke='none' text-anchor='middle'>v2</text></g><clipPath id='fr39'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "MATRIZ DE ITERACIÓN • COLUMNA 3",
          "title": "3. AJUSTE DE DISEÑO Y RETESTEO INMEDIATO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Cada versión del prototipo debe integrar mejoras directas basadas en la experiencia. La regla de oro: modificar una variable a la vez para poder atribuir con certeza científica la causa del nuevo resultado.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Diseño de Solución al Fallo):</strong><br>\n                  • <em>Prompt de Reingeniería Rápida:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'El prototipo de Vitrina falló en dos puntos durante la prueba en la Tienda El Triunfo: 1) Se confundieron los pedidos de dos clientes con el mismo nombre (la señora del corner) porque no había identificador único, 2) A las 7:00 p.m. quedaron 6 mensajes sin responder porque Sofía ya no alcanzaba después de la jornada. Propón 3 adaptaciones de bajo costo para resolver ambos antes de 48 horas: 1) Asignar número de pedido visible (Pedido #12) y pedir nombre completo + dirección en el primer mensaje, 2) Configurar respuesta automática fuera de horario (te atendemos desde las 7:00 a.m.), 3) Agregar confirmación automática de producto (¿arroz Diana x500g? responde SÍ).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Refinamiento Caso Práctico (Versión 2):</strong>\n                  A cada cliente se le asignó un número de pedido visible (\"Pedido #12\") y se definieron respuestas automáticas fuera de horario (\"te atendemos desde las 7:00 a.m.\"). Resultado: 9 de 10 pedidos completados y entregados bien.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"35\" y=\"25\" width=\"230\" height=\"135\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"2\"/>\n                  <circle cx=\"150\" cy=\"65\" r=\"26\" fill=\"#10b981\"/>\n                  <text x=\"150\" y=\"73\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"20\" fill=\"#ffffff\">✓</text>\n\n                  <rect x=\"50\" y=\"105\" width=\"200\" height=\"22\" rx=\"4\" fill=\"#ffffff\" stroke=\"#10b981\" stroke-width=\"1\"/>\n                  <text x=\"150\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#15803d\">SIRENA 95 dB • ACERO INOXIDABLE 316</text>\n\n                  <text x=\"150\" y=\"146\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#14532d\">9 DE 10 PEDIDOS BIEN EN LA PRUEBA</text>\n                </svg>\n                <span class=\"graphic-caption\">REFINAMIENTO TECNOLÓGICO VALIDADO</span>\n              </div>\n            </div>\n          "
        }
      }

      "label": "VER PLANTILLA: I.1 MAPA DE HIPÓTESIS EXPERIMENTAL",
      "title": "PLANTILLA I.1: MAPA DE HIPÓTESIS EXPERIMENTAL",
      "html": "<div class=\"template-doc\"><div class=\"card-meta-line\">\n          <h3 class=\"template-name\">PLANTILLA I.1: MAPA DE HIPÓTESIS EXPERIMENTAL</h3>\n          <span class=\"tag-badge-solid\">DEFINICIÓN DE TEST</span>\n        </div>\n\n        <div class=\"template-instructions\">\n          No salgas a probar para \"ver qué pasa\". Define qué aspecto crítico pondrás a prueba y qué cifra concreta validará o refutará tu idea.\n        </div>\n\n        <div class=\"grid-4\">\n          <div>\n            <label class=\"field-tag\" for=\"i_hip_punto\">1. Punto Clave a Probar</label>\n            <textarea id=\"i_hip_punto\" placeholder=\"Ej: Sirena piezoeléctrica para aviso de corte térmico en el tanque.\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"i_hip_requisito\">2. Requisitos Mínimos</label>\n            <textarea id=\"i_hip_requisito\" placeholder=\"Ej: Sonido audible a 80 metros con el motor de beneficio operando.\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"i_hip_pregunta\">3. Pregunta de Investigación</label>\n            <textarea id=\"i_hip_pregunta\" placeholder=\"Ej: ¿El operario escucha la alarma mientras seca café en los paseros?\"></textarea>\n          </div>\n          <div>\n            <label class=\"field-tag\" for=\"i_hip_metrica\">4. Hipótesis (Métrica de Éxito)</label>\n            <textarea id=\"i_hip_metrica\" placeholder=\"Ej: Al menos 8 de cada 10 alertas son atendidas antes de 15 minutos.\"></textarea>\n          </div>\n        </div></div>"

        "detail": {
          "tag": "PLAN DE EVOLUCIÓN • ETAPA 1",
          "title": "1. HITOS DE CONTROL TEMPORAL EN TERRITORIO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Estructurar las metas en bloques de 30 días para evitar dilatar el impacto. Cada hito debe tener un responsable inequívoco, un entregable físico y una métrica de aprobación sin ambigüedades.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Generador de KPIs):</strong><br>\n                  • <em>Prompt de Definición de Métricas:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Genera 3 métricas líderes (lead indicators) y 3 métricas de resultado (lag indicators) para medir el éxito de Vitrina en la Tienda El Triunfo durante el primer mes: Líderes: 1) Tiempo promedio de respuesta a mensajes de WhatsApp (meta: menos de 1 minuto), 2) Porcentaje de pedidos con dirección completa en el primer mensaje (meta: 100%), 3) Número de mensajes respondidos fuera de horario automáticamente (meta: todos). Resultado (lag): 1) Número de pedidos olvidados/no entregados (meta: 0, vs 4 el mes pasado), 2) Monto de deudas sin cobrar a fin de mes (meta: $0, vs $180.000 COP), 3) Ventas por WhatsApp vs mes anterior (meta: +20%).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Control Caso Práctico:</strong>\n                  Hito 30: cero pedidos sin dirección completa. Hito 60: el 100% de los fiados cobrados a fin de mes. Hito 90: aumento del 20% en las ventas por WhatsApp comparado con el mes anterior.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <line x1=\"40\" y1=\"90\" x2=\"260\" y2=\"90\" stroke=\"#cbd5e1\" stroke-width=\"3\"/>\n                  \n                  <circle cx=\"60\" cy=\"90\" r=\"14\" fill=\"#1f00ff\"/>\n                  <text x=\"60\" y=\"95\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\">H1</text>\n                  <text x=\"60\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#1e3a8a\">Día 30 (Piloto)</text>\n\n                  <circle cx=\"150\" cy=\"90\" r=\"14\" fill=\"#ff622b\"/>\n                  <text x=\"150\" y=\"95\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\">H2</text>\n                  <text x=\"150\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#7c2d12\">Día 60 (cobro)</text>\n\n                  <circle cx=\"240\" cy=\"90\" r=\"14\" fill=\"#10b981\"/>\n                  <text x=\"240\" y=\"95\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\">H3</text>\n                  <text x=\"240\" y=\"120\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#14532d\">Día 90 (Escala)</text>\n\n                  <text x=\"150\" y=\"155\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#0f172a\">SECUENCIA DE CONTROL TEMPORAL EN CAMPO</text>\n                </svg>\n                <span class=\"graphic-caption\">HITOS TEMPORALES CRÍTICOS A 90 DÍAS</span>\n              </div>\n            </div>\n          "
        }

        "num": "02",
        "title": "SPARRING CRÍTICO CON IA",
        "body": "Simular entrevistas hostiles con IA: asumir roles de comprador despiadado, banco desconfiado o campesino resistente.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr44)'><rect x='28' y='26' width='72' height='32' rx='9'/><polygon points='58,58 52,72 70,58'/><text x='64' y='47' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>¿y si falla?</text><g stroke='#1f00ff'><rect x='100' y='54' width='72' height='32' rx='9'/><polygon points='142,54 148,40 130,54'/></g><text x='136' y='75' font-family='cursive' font-size='9' fill='#1f00ff' stroke='none' text-anchor='middle'>¡datos!</text><g stroke='#a8a8a8' stroke-width='1.5'><line x1='96' y1='44' x2='104' y2='52'/><line x1='104' y1='40' x2='100' y2='50'/><line x1='100' y1='48' x2='108' y2='48'/></g></g><clipPath id='fr44'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "SPARRING CON IA • ETAPA 2",
          "title": "2. SIMULACIÓN DE ESCÉPTICOS: EL GOLPE DE REALIDAD",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Antes de salir a defender tu propuesta ante jurados, clientes o inversionistas, debes someterla a un sparring despiadado con IA. La IA no tiene compasión ni sesgo de cortesía, y atacará todos los flancos débiles de tu proyecto.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Prompt Canónico de Sparring Escéptico):</strong><br>\n                  • <em>Prompt de Sparring Hostil:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Te voy a presentar mi solución: Vitrina, el asistente de ventas por WhatsApp con IA para la Tienda El Triunfo de Don Hernando y Sofía. Hazme 5 preguntas demoledoras sobre: 1) ¿Cuánto cuesta realmente mantenerlo cada mes después de los $120.000 COP iniciales? 2) ¿Qué pasa si el cliente manda un audio en vez de texto? 3) ¿Por qué Sofía dejaría de usarlo después del primer mes? 4) ¿Cómo funciona cuando no hay datos móviles en la tienda? 5) ¿Qué impide que otro tendero del municipio lo copie gratis?'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Blindaje Caso Práctico:</strong>\n                  La IA preguntó: \"¿y si el cliente escribe mal el nombre del producto o manda un audio en vez de texto?\". Eso obligó a agregar una confirmación automática (\"¿quieres 'arroz Diana x 500 g'? responde SÍ\") y soporte para mensajes de voz.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Sparring Hostil IA -->\n                  <rect x=\"25\" y=\"30\" width=\"115\" height=\"95\" rx=\"6\" fill=\"#fef2f2\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n                  <text x=\"82\" y=\"55\" text-anchor=\"middle\" font-size=\"20\">🤖</text>\n                  <text x=\"82\" y=\"78\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#b91c1c\">IA HOSTIL</text>\n                  <text x=\"82\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#7f1d1d\">Preguntas difíciles</text>\n                  <text x=\"82\" y=\"112\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#7f1d1d\">Sin filtros</text>\n\n                  <path d=\"M 145 75 L 155 75\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n                  <polygon points=\"152,70 162,75 152,80\" fill=\"#ef4444\"/>\n\n                  <rect x=\"160\" y=\"30\" width=\"115\" height=\"95\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"217\" y=\"55\" text-anchor=\"middle\" font-size=\"20\">🛡️</text>\n                  <text x=\"217\" y=\"78\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#15803d\">PROPUESTA BLINDADA</text>\n                  <text x=\"217\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#14532d\">Respuestas sólidas</text>\n                  <text x=\"217\" y=\"112\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#14532d\">Evidencia probada</text>\n\n                  <rect x=\"35\" y=\"145\" width=\"230\" height=\"22\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"160\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ffffff\">ENTRENAMIENTO PREVIO SIN PIEDAD</text>\n                </svg>\n                <span class=\"graphic-caption\">SPARRING CON INTELIGENCIA ARTIFICIAL</span>\n              </div>\n            </div>\n          "
        }

      {

        "title": "SOSTENIBILIDAD OPERATIVA",

          "title": "3. MODELO DE SOSTENIBILIDAD Y RETORNO ECONÓMICO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Ningún proyecto social perdura si depende eternamente de donaciones o filantropía. La sostenibilidad requiere demostrar que la solución genera suficiente excedente económico para pagarse sola y mantener su operación.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Modelado Financiero):</strong><br>\n                  • <em>Prompt de ROI Frugal:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Construye un cálculo de retorno de inversión (ROI) para una tienda de barrio con 30 pedidos por WhatsApp al mes. Compara: ventas actuales con 4 pedidos perdidos y $180.000 COP sin cobrar vs ventas con un asistente que no olvida nada.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Números Reales Caso Práctico:</strong>\n                  Vitrina cuesta menos de $120.000 COP en su primera versión. Recuperar solo 2 pedidos olvidados o 1 deuda olvidada al mes ya paga la herramienta; con 30 clientes al mes, se paga varias veces sola.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Retorno de inversión claro -->\n                  <rect x=\"40\" y=\"30\" width=\"100\" height=\"95\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n                  <text x=\"90\" y=\"55\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ef4444\">COSTO VITRINA</text>\n                  <text x=\"90\" y=\"85\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"18\" fill=\"#ef4444\">$120K</text>\n                  <text x=\"90\" y=\"105\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#7f1d1d\">Pago único</text>\n\n                  <rect x=\"160\" y=\"30\" width=\"100\" height=\"95\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n                  <text x=\"210\" y=\"55\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#15803d\">VALOR GANADO</text>\n                  <text x=\"210\" y=\"85\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"18\" fill=\"#10b981\">+$1.12M</text>\n                  <text x=\"210\" y=\"105\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#14532d\">Por mes (ROI 3x)</text>\n\n                  <rect x=\"35\" y=\"145\" width=\"230\" height=\"22\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"160\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ffffff\">SOSTENIBILIDAD FINANCIERA AUTÓNOMA</text>\n                </svg>\n                <span class=\"graphic-caption\">CÁLCULO DE RETORNO ECONÓMICO INMEDIATO</span>\n              </div>\n            </div>\n          "

        "detail": {
          "tag": "PITCH GENIA • ACTO 1",
          "title": "PASOS 1 Y 2: EL GANCHO HUMANO Y LA EVIDENCIA IRREFUTABLE",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  • <em>Paso 1 (Motivación):</em> Nunca comiences saludando a la mesa técnica. Comienza con una historia humana viva: 'Sofía pierde cada mes pedidos y deudas por atender sola el celular de la tienda'.<br>\n                  • <em>Paso 2 (Evidencia):</em> Salta de lo individual a lo estadístico: 'Pero no es solo ella: la mitad de las tiendas del barrio pierden ventas por mensajes sin responder o pedidos olvidados'.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Redactor del Gancho Inicial):</strong><br>\n                  • <em>Prompt de Apertura Dramática:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Redacta los primeros 30 segundos de un pitch para Vitrina combinando una anécdota humana conmovedora con un dato económico impactante: \"La semana pasada Sofía llegó a la Tienda El Triunfo a las 8 de la noche y encontró un mensaje de un cliente que decía se basaló el pedido, me voy a la tienda de enfrente. Ese mes fueron 4 pedidos perdidos por direcciones mal copiadas en un cuaderno mojado, y $180.000 COP en deudas que olvidó cobrar a 3 clientes de toda la vida. Eso le pasa a la mitad de las tiendas del barrio\".'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Guion Caso Práctico (Minuto 0:00 a 0:45):</strong>\n                  \"Sofía atiende sola el WhatsApp de la tienda mientras atiende la fila: el mes pasado se perdieron 4 pedidos y quedaron $180.000 sin cobrar. Y eso le pasa a la mitad de las tiendas del barrio\".</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"25\" y=\"30\" width=\"115\" height=\"95\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"82\" y=\"55\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"18\" fill=\"#1f00ff\">PASO 01</text>\n                  <text x=\"82\" y=\"78\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#1e3a8a\">MOTIVACIÓN</text>\n                  <text x=\"82\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Historia humana</text>\n                  <text x=\"82\" y=\"112\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Conexión empática</text>\n\n                  <rect x=\"160\" y=\"30\" width=\"115\" height=\"95\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"217\" y=\"55\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"18\" fill=\"#ff622b\">PASO 02</text>\n                  <text x=\"217\" y=\"78\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#7c2d12\">EVIDENCIA</text>\n                  <text x=\"217\" y=\"98\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Dato territorial</text>\n                  <text x=\"217\" y=\"112\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Magnitud del dolor</text>\n\n                  <rect x=\"35\" y=\"145\" width=\"230\" height=\"22\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"160\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#ffffff\">ACTO 1: CONEXIÓN EMOCIONAL Y RIGOR FACTUAL</text>\n                </svg>\n                <span class=\"graphic-caption\">ESTRUCTURA DE APERTURA NARRATIVA</span>\n           "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  • <em>Paso 3 (La Solución):</em> Presentar el invento con claridad cristalina. Mostrar el objeto físico o la maqueta.<br>\n                  • <em>Paso 4 (Proceso Maker):</em> Contar con honestidad las iteraciones: 'Empezamos con respuestas manuales que se demoraban, falló con clientes que se iban, y rediseñamos hasta lograr respuesta en segundos'. Demuestra que el equipo sabe resolver problemas reales.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Narrativa de Aprendizaje):</strong><br>\n                  • <em>Prompt de Historia Maker:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Sintetiza en 45 segundos cómo pasamos de mensajes sin responder a un asistente validado por los clientes del barrio.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Guion Caso Práctico (Minuto 0:45 a 1:45):</strong>\n                  \"Creamos Vitrina: un asistente de WhatsApp con IA que responde solo, anota los pedidos y recuerda las deudas. Lo probamos una semana con clientes reales y, tras dos ajustes, 9 de cada 10 pedidos se cerraron bien\".</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"25\" y=\"30\" width=\"115\" height=\"95\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"82\" y=\"55\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"18\" fill=\"#1f00ff\">PASO 03</text>\n                  <text x=           </div>
        </div>

        <div class="interactive-grid ${data.gridClass}">
          ${cardsHtml}
        </div>

        <div class="slide-bottom-bar">
          <div class="rigor-statement">
            <span class="rigor-marker"></span>
            <span>${data.rigor}</span>
          </div>
          ${data.templateBtn ? `<button class="btn-template-trigger" onclick="openTemplate(${idx})">
            📄 ${data.templateBtn.label}
          </button>` : ''}
        </div>
      `;

      // 4. Actualizar botones Nav
      document.getElementById('btn-prev').disabled = (idx === 0);
      document.getElementById('btn-next').disabled = (idx === SLIDES_DATA.length - 1);
    }

    // ABRIR DETALLE POR CLIC EN TARJETA
    function openDetail(slideIdx, cardIdx) {
      const cardData = SLIDES_DATA[slideIdx].cards[cardIdx];
      visitedCards.add(slideIdx + ':' + cardIdx);
      const cardEls = document.querySelectorAll('#slide-canvas .explore-card');
      if (cardEls[cardIdx]) cardEls[cardIdx].classList.add('visited-card');
      document.getElementById('insp-tag').innerText = cardData.detail.tag;
      document.getElementById('insp-title').innerText = cardData.detail.title;
      document.getElementById('insp-body').innerHTML = cardData.detail.html;
      document.getElementById('inspector-overlay').style.display = 'flex';
    }

    // ABRIR PLANTILLA EN ACCIÓN POR CLIC
    function openTemplate(slideIdx) {
      const tmpl = SLIDES_DATA[slideIdx].templateBtn;
      document.getElementById('insp-tag').innerText = 'PLANTILLA TÉCNICA EN ACCIÓN • METODOLOGÍA GENIA';
      document.getElementById('insp-title').innerText = tmpl.title;
      document.getElementById('insp-body').innerHTML = tmpl.html;
      document.getElementById('inspector-overlay').style.display = 'flex';
    }

    // COPIAR PROMPT DESDE LA CONSOLA (BOTÓN POR PROMPT)
    function copyPrompt(e) {
      const box = e.target.closest('.prompt-console');
      if (!box) return;
      const btn = e.target.closest('.prompt-copy-btn') || box.querySelector('.prompt-copy-btn');
      const clone = box.cloneNode(true);
      const ghost = clone.querySelector('.prompt-copy-btn');
      if (ghost) ghost.remove();
      let text = clone.textContent.trim();
      if (text.startsWith("'") && text.endsWith("'")) {
        text = text.slice(1, -1);
      }
      const done = () => {
        if (!btn) return;
        if (btn._copyTimer) clearTimeout(btn._copyTimer);
        btn.classList.add('copied');
        btn.innerText = 'COPIADO';
        btn._copyTimer = setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerText = 'COPIAR';
        }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => {
          copyPromptFallback(text);
          done();
        });
      } else {
        copyPromptFallback(text);
        done();
      }
    }

    function copyPromptFallback(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (err) {}
      document.body.removeChild(ta);
    }

    // MODO ZOOM ("Z") • DESTACAR CONTENIDO DEL MODAL (TOTALMENTE ROBUSTO)
    function toggleZoomInspector() {
      const overlay = document.getElementById('inspector-overlay');
      const card = document.getElementById('inspector-card');
      const header = document.querySelector('.deck-header');
      const stage = document.getElementById('deck-stage');
      const footer = document.querySelector('.deck-footer');
      const btnLabel = document.getElementById('zoom-btn-label');
      const btn = document.getElementById('btn-zoom-toggle');

      if (!overlay || overlay.style.display !== 'flex') return;

      isZoomed = !isZoomed;

      if (isZoomed) {
        overlay.classList.add('zoomed-mode');
        if (card) card.classList.add('zoomed');
        if (header) header.classList.add('under-zoom');
        if (stage) stage.classList.add('under-zoom');
        if (footer) footer.classList.add('under-zoom');
        if (btnLabel) btnLabel.innerText = 'REDUCIR (Z)';
        if (btn) btn.classList.add('active');
      } else {
        overlay.classList.remove('zoomed-mode');
        if (card) card.classList.remove('zoomed');
        if (header) header.classList.remove('under-zoom');
        if (stage) stage.classList.remove('under-zoom');
        if (footer) footer.classList.remove('under-zoom');
        if (btnLabel) btnLabel.innerText = 'DESTACAR (Z)';
        if (btn) btn.classList.remove('active');
      }
    }

    function hideInspector() {
      const overlay = document.getElementById('inspector-overlay');
      const card = document.getElementById('inspector-card');
      const header = document.querySelector('.deck-header');
      const stage = document.getElementById('deck-stage');
      const footer = document.querySelector('.deck-footer');
      const btnLabel = document.getElementById('zoom-btn-label');
      const btn = document.getElementById('btn-zoom-toggle');

      if (isZoomed) {
        isZoomed = false;
        if (overlay) overlay.classList.remove('zoomed-mode');
        if (card) card.classList.remove('zoomed');
        if (header) header.classList.remove('under-zoom');
        if (stage) stage.classList.remove('under-zoom');
        if (footer) footer.classList.remove('under-zoom');
        if (btnLabel) btnLabel.innerText = 'DESTACAR (Z)';
        if (btn) btn.classList.remove('active');
      }

      if (overlay) overlay.style.display = 'none';
    }

    function closeInspector(e) {
      if (e.target.id === 'inspector-overlay') {
        hideInspector();
      }
    }

    function isVisitedCard(slideIdx, cardIdx) {
      return visitedCards.has(slideIdx + ':' + cardIdx);
    }

    // REINICIAR MEMORIA DE MODALES ABIERTOS (TECLA R) • TODAS LAS TARJETAS AL COLOR ORIGINAL
    function resetVisitedCards() {
      visitedCards.clear();
      document.querySelectorAll('.explore-card.visited-card').forEach(el => el.classList.remove('visited-card'));
    }

    function nextSlide() {
      hideInspector();
      if (currentIdx < SLIDES_DATA.length - 1) {
        currentIdx++;
        renderSlide(currentIdx);
      }
    }

    function prevSlide() {
      hideInspector();
      if (currentIdx > 0) {
        currentIdx--;
        renderSlide(currentIdx);
      }
    }

    function goToPhase(phase) {
      hideInspector();
      const targetIdx = SLIDES_DATA.findIndex(s => s.phase === phase);
      if (targetIdx !== -1) {
        currentIdx = targetIdx;
        renderSlide(currentIdx);
      }
    }

    // EVENTOS DE TECLADO (Z PARA ZOOM, FLECHAS, ESC, R REINICIA MODALES VISITADOS)
    document.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('inspector-overlay');
      const isOverlayOpen = (overlay && overlay.style.display === 'flex');

      if (e.key === 'Escape') {
        hideInspector();
      } else if (isOverlayOpen && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        toggleZoomInspector();
      } else if (!isOverlayOpen) {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'r' || e.key === 'R') {
          resetVisitedCards();
        }
      }
    });

    // INICIALIZACIÓN
    document.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
</body>
</html>
