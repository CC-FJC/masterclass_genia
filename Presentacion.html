<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METODOLOGÍA GENIA • Taller • Centro de Ciencia Francisco José de Caldas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       PATCH DESIGN SYSTEM TOKENS & HIGH-CONTRAST VISUAL SYSTEM
       ========================================================================== */
    :root {
      --color-electric-indigo: #1f00ff;
      --color-deep-indigo: #0e008a;
      --color-patch-orange: #ff622b;
      --color-pure-white: #ffffff;
      --color-fog-gray: #f4f5f8;
      --color-visited-gray: #e2e5ee;
      --color-bone: #f9f9fc;
      --color-mist: #e2e4ed;
      --color-gridline: rgba(255, 255, 255, 0.14);
      --color-ink: #111116;
      --color-ink-light: #444452;
      --color-success: #10b981;
      --color-danger: #ef4444;
      --color-accent-blue: #0284c7;

      --font-display: 'Bebas Neue', 'PP Right', Anton, -apple-system, sans-serif;
      --font-body: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --radius-cards: 6px;
      --radius-buttons: 5px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* PANTALLA ESTÁTICA FULLSCREEN (ZERO-SCROLL) */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--color-electric-indigo);
      color: var(--color-pure-white);
      font-family: var(--font-body);
      background-image: 
        linear-gradient(var(--color-gridline) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-gridline) 1px, transparent 1px);
      background-size: 32px 32px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ==========================================================================
       CABECERA SUPERIOR
       ========================================================================== */
    header.deck-header {
      height: 72px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(31, 0, 255, 0.96);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 100;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo-hero {
      width: 195px;
      height: 50px;
      object-fit: cover;
      object-position: 50% 60%;
      display: block;
    }

    .brand-v-rule {
      width: 1px;
      height: 38px;
      background: rgba(255, 255, 255, 0.35);
    }

    .caption-mono {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-pure-white);
    }

    .timeline-strip {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phase-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-cards);
      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .phase-chip:hover {
      border-color: rgba(255, 255, 255, 0.8);
      color: #fff;
    }

    .phase-chip.done {
      border-color: rgba(255, 255, 255, 0.6);
      color: var(--color-pure-white);
      background: rgba(255, 255, 255, 0.12);
    }

    .phase-chip.active {
      border-color: var(--color-patch-orange);
      background: var(--color-patch-orange);
      color: var(--color-pure-white);
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(255, 98, 43, 0.5);
    }

    .phase-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .corner-marker-box {
      min-width: 44px;
      height: 44px;
      padding: 0 8px;
      border: 1px solid var(--color-pure-white);
      border-radius: var(--radius-cards);
      color: var(--color-pure-white);
      font-family: var(--font-display);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
      background: rgba(255, 255, 255, 0.05);
    }

    /* ==========================================================================
       CANVAS FULLSCREEN PRINCIPAL
       ========================================================================== */
    main.deck-stage {
      flex: 1;
      height: calc(100vh - 132px);
      padding: 16px 36px 14px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    .slide-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: morphSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes morphSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-top-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--color-pure-white);
      border-radius: var(--radius-buttons);
      padding: 3px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-pure-white);
      background: rgba(255, 255, 255, 0.08);
    }

    .slide-hero-title {
      font-family: var(--font-display);
      font-size: clamp(38px, 4.6vw, 68px);
      line-height: 0.92;
      color: var(--color-pure-white);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin: 20px 0 4px 0;
    }

    .slide-hero-subtitle {
      font-size: 14.5px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.92);
      max-width: 980px;
      line-height: 1.38;
    }

    /* ==========================================================================
       TARJETAS DE ALTO CONTRASTE (BLANCO SÓLIDO Y NÍTIDO)
       ========================================================================== */
    .interactive-grid {
      display: grid;
      grid-auto-rows: minmax(0, 1fr);
      gap: clamp(8px, 1.4vh, 14px);
      margin: 10px 0;
      flex: 1;
      align-items: stretch;
      min-height: 0;
    }

    .grid-2, .two-cols { grid-template-columns: repeat(2, 1fr); }
    .grid-3, .three-cols { grid-template-columns: repeat(3, 1fr); }
    .grid-4, .four-cols { grid-template-columns: repeat(4, 1fr); }
    .grid-5 { grid-template-columns: repeat(5, 1fr); }

    .explore-card {
      background: var(--color-pure-white);
      color: var(--color-ink);
      border: 2px solid var(--color-electric-indigo);
      border-radius: var(--radius-cards);
      padding: clamp(10px, 1.8vh, 20px) clamp(14px, 1.6vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.24);
    }

    .explore-card:hover {
      transform: translateY(-5px);
      border-color: var(--color-patch-orange);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38);
    }

    /* ESTADO VISITADO: el modal de esta tarjeta ya se abrió (se limpia con tecla R) */
    .explore-card.visited-card {
      background: var(--color-visited-gray);
      border-color: #868fa6;
      color: var(--color-ink-light);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    }

    .explore-card.visited-card:hover {
      border-color: var(--color-patch-orange);
      background: var(--color-visited-gray);
    }

    .explore-card > div {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .explore-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .explore-card-num {
      font-family: var(--font-display);
      font-size: clamp(30px, 3.2vw, 44px);
      color: var(--color-patch-orange);
      line-height: 1;
      letter-spacing: 0.03em;
    }

    .click-prompt {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-electric-indigo);
      background: rgba(31, 0, 255, 0.08);
      padding: 3px 8px;
      border-radius: 3px;
    }

    .explore-card-title {
      font-family: var(--font-display);
      font-size: clamp(20px, 2.1vw, 28px);
      color: var(--color-electric-indigo);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .explore-card-body {
      font-size: clamp(13px, 1.15vw, 16.5px);
      line-height: 1.42;
      color: #333333;
      margin-bottom: 8px;
    }

    .card-blueprint {
      margin: auto 0;
      padding: 8px 0;
      flex-shrink: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-blueprint svg {
      width: 100%;
      max-width: 380px;
      height: auto;
      max-height: clamp(90px, 18vh, 190px);
      display: block;
    }

    .genia-hero-card .card-blueprint svg {
      max-width: 230px;
      max-height: clamp(56px, 10vh, 120px);
    }

    /* ==========================================================================
       RESPONSIVE: LAS COLUMNAS SE ADAPTAN AL ANCHO DE LA PANTALLA
       ========================================================================== */
    @media (max-width: 1200px) {
      .grid-4, .four-cols, .grid-5 { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .grid-3, .three-cols, .grid-4, .four-cols, .grid-5 { grid-template-columns: repeat(2, 1fr); }
      main.deck-stage { padding: 12px 18px 10px 18px; }
    }
    @media (max-width: 620px) {
      .grid-2, .two-cols, .grid-3, .three-cols, .grid-4, .four-cols, .grid-5 { grid-template-columns: 1fr; }
      header.deck-header { padding: 0 14px; height: 60px; }
      .timeline-strip { display: none; }
      footer.deck-footer { padding: 0 14px; }
      main.deck-stage { padding: 10px 14px 8px 14px; }
      .slide-hero-title { font-size: clamp(26px, 7vw, 40px); }
      .card-blueprint svg { max-height: 110px; }
    }

    .tag-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      border-top: 1px solid var(--color-mist);
      padding-top: 8px;
    }

    .mini-pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--color-bone);
      border: 1px solid var(--color-mist);
      color: var(--color-ink);
    }

    .mini-pill.ai {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
      font-weight: 800;
    }

    /* BARRA INFERIOR DEL LIENZO */
    .slide-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding-top: 10px;
      flex-shrink: 0;
    }

    .rigor-statement {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.95);
      max-width: 74%;
      line-height: 1.35;
    }

    .rigor-marker {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--color-patch-orange);
      box-shadow: 0 0 10px var(--color-patch-orange);
      flex-shrink: 0;
    }

    .btn-template-trigger {
      font-family: var(--font-body);
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--color-patch-orange);
      color: var(--color-pure-white);
      border: 1px solid var(--color-patch-orange);
      border-radius: var(--radius-buttons);
      padding: 8px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(255, 98, 43, 0.4);
    }

    .btn-template-trigger:hover {
      background: #e54f1f;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 98, 43, 0.6);
    }

    /* ==========================================================================
       MODAL DE INSPECCIÓN ENRIQUECIDO Y GRÁFICOS RESPONSIVOS SIN DESBORDE
       ========================================================================== */
    .inspector-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 0, 110, 0.88);
      backdrop-filter: blur(14px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: overlayFadeIn 0.22s ease-out;
    }

    @keyframes overlayFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .inspector-card {
      background: var(--color-pure-white);
      color: var(--color-ink);
      border: 2px solid var(--color-electric-indigo);
      border-radius: var(--radius-cards);
      width: 100%;
      max-width: 1160px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    .inspector-header {
      background: var(--color-fog-gray);
      border-bottom: 1px solid var(--color-mist);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .inspector-title {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--color-electric-indigo);
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .btn-close-inspector {
      background: var(--color-ink);
      border: 1px solid var(--color-ink);
      color: var(--color-pure-white);
      border-radius: var(--radius-buttons);
      padding: 7px 16px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-close-inspector:hover {
      background: var(--color-patch-orange);
      border-color: var(--color-patch-orange);
    }

    .inspector-content {
      flex: 1;
      padding: 22px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* PANELES DIVIDIDOS DENTRO DEL MODAL */
    .modal-split-view {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      align-items: stretch;
      width: 100%;
    }

    .modal-text-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--color-ink);
      min-width: 0;
    }

    .methodology-block {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--color-electric-indigo);
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.48;
    }

    .ai-copilot-block {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-left: 4px solid var(--color-accent-blue);
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.48;
    }

    .case-applied-block {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-left: 4px solid var(--color-patch-orange);
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.48;
    }

    /* PANEL GRÁFICO BLINDADO (ZERO-OVERFLOW) */
    .modal-graphic-panel {
      background: var(--color-bone);
      border: 1px solid var(--color-mist);
      border-radius: var(--radius-cards);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 0;
      width: 100%;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.02);
    }

    .modal-graphic-panel svg {
      width: 100%;
      max-width: 320px;
      height: auto;
      max-height: 220px;
      display: block;
    }

    .graphic-caption {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-top: 8px;
      text-align: center;
    }

    /* PLANTILLAS INTERACTIVAS ESTILIZADAS */
    .tmpl-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tmpl-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .tmpl-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .tmpl-cell-box {
      border: 1px solid var(--color-mist);
      border-radius: var(--radius-cards);
      padding: 12px 14px;
      background: var(--color-bone);
    }

    .tmpl-cell-box.highlight {
      border-color: var(--color-patch-orange);
      background: #fff9f6;
    }

    .tmpl-cell-box.primary {
      border-color: var(--color-electric-indigo);
      background: #f5f5ff;
    }

    .tmpl-cell-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--color-electric-indigo);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.04em;
    }

    .tmpl-cell-val {
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--color-ink);
    }

    /* ==========================================================================
       TABLAS DE PLANTILLAS (CONTENIDO DE TEMPLATE-BTN • CERO DESBORDE)
       ========================================================================== */
    .template-doc {
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .template-doc h4 {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 0.06em;
      color: var(--color-ink);
      margin: 0 0 12px;
    }

    .template-doc p {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--color-ink-light);
      margin: 0 0 12px;
    }

    .template-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: var(--color-pure-white);
      border: 1px solid var(--color-mist);
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--color-ink);
    }

    .template-table th {
      background: var(--color-deep-indigo);
      color: var(--color-pure-white);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      padding: 9px 10px;
      vertical-align: bottom;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .template-table td {
      padding: 9px 10px;
      border: 1px solid var(--color-mist);
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .template-table tbody tr:nth-child(even) td {
      background: var(--color-bone);
    }

    @media (max-width: 620px) {
      .template-table {
        font-size: 11.5px;
      }
      .template-table th,
      .template-table td {
        padding: 6px 7px;
      }
    }

    /* ==========================================================================
       PLANTILLAS GENIA EDITABLES (PORTADAS DE plantillas_formatoGENIA.html)
       ========================================================================== */
    .template-doc .card-meta-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--color-mist);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .template-doc .template-name {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--color-electric-indigo);
      letter-spacing: 0.03em;
    }

    .template-doc .tag-badge-solid,
    .template-doc .tag-badge-orange {
      background: var(--color-electric-indigo);
      color: var(--color-pure-white);
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .template-doc .tag-badge-orange {
      background: var(--color-patch-orange);
    }

    .template-doc .template-instructions {
      background: var(--color-bone);
      border-left: 3px solid var(--color-electric-indigo);
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 13.5px;
      color: #333333;
      line-height: 1.45;
    }

    .template-doc label.field-tag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-electric-indigo);
      margin-bottom: 6px;
    }

    .template-doc input[type="text"],
    .template-doc textarea {
      width: 100%;
      background: var(--color-pure-white);
      border: 1px solid #c9cdd8;

          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Fundamento Metodológico:</strong> Evitar la 'ceguera del experto'. La mayoría de proyectos fracasan porque diseñan artefactos tecnológicamente avanzados pero humanos e inútiles en la práctica cotidiana de la comunidad.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>La IA como Copiloto Empático:</strong><br>\n                  Utiliza modelos de lenguaje para mapear sesgos cognitivos y generar guías de entrevista no directivas.<br>\n                  <em>Prompt sugerido:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Genera 5 preguntas abiertas para entender la fricción de Sofía al atender los pedidos por WhatsApp de la Tienda El Triunfo mientras atiende la fila de la tienda, evitando preguntas cerradas de sí/no.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  En lugar de asumir que necesitan \"una app complicada\", el equipo pasó una mañana entera en la Tienda El Triunfo viendo cómo trabaja Sofía: sentado junto a ella mientras respondía 40 mensajes de WhatsApp y anotaba los pedidos en un cuaderno que se le cayó dos veces.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <circle cx=\"150\" cy=\"90\" r=\"62\" fill=\"none\" stroke=\"#1f00ff\" stroke-width=\"2\" stroke-dasharray=\"4,4\"/>\n                  <circle cx=\"150\" cy=\"90\" r=\"42\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"2.5\"/>\n                  <text x=\"150\" y=\"85\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"800\" font-size=\"11\" fill=\"#1f00ff\">COMUNIDAD</text>\n                  <text x=\"150\" y=\"100\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"9\" fill=\"#475569\">EN EL CENTRO</text>\n                  \n                  <!-- Píldoras con ancho seguro para cada palabra -->\n                  <rect x=\"120\" y=\"12\" width=\"60\" height=\"20\" rx=\"10\" fill=\"#ff622b\"/>\n                  <text x=\"150\" y=\"25\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8.5\" font-weight=\"700\" fill=\"#ffffff\">ESCUCHA</text>\n                  \n                  <rect x=\"194\" y=\"80\" width=\"60\" height=\"20\" rx=\"10\" fill=\"#10b981\"/>\n                  <text x=\"224\" y=\"93\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8.5\" font-weight=\"700\" fill=\"#ffffff\">OBSERVA</text>\n                  \n                  <rect x=\"120\" y=\"148\" width=\"60\" height=\"20\" rx=\"10\" fill=\"#1f00ff\"/>\n                  <text x=\"150\" y=\"161\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8.5\" font-weight=\"700\" fill=\"#ffffff\">CO-CREA</text>\n                  \n                  <rect x=\"46\" y=\"80\" width=\"60\" height=\"20\" rx=\"10\" fill=\"#ff622b\"/>\n                  <text x=\"76\" y=\"93\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8.5\" font-weight=\"700\" fill=\"#ffffff\">EMPATA</text>\n                </svg>\n                <span class=\"graphic-caption\">NÚCLEO EMPÁTICO DE DISEÑO CENTRADO EN EL USUARIO</span>\n              </div>\n            </div>\n"

          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Fundamento Metodológico:</strong> Romper la dependencia de subsidios e importaciones costosas. La Cultura Maker promueve el 'pensar con las manos': si una idea no se puede tangibilizar con insumos locales en 48 horas, sigue siendo una teoría abstracta.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>La IA como Asistente de Taller Maker:</strong><br>\n                  La IA descompone procesos complejos en pasos simples que cualquier tendero puede seguir.<br>\n                  <em>Prompt sugerido:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'¿Cómo puedo organizar los pedidos de mi tienda por WhatsApp usando solo el celular que ya tengo y herramientas gratis, sin instalar nada nuevo?'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  En vez de pagar una plataforma de $300.000 COP al mes, armaron el primer \"asistente\" con un celular viejo, WhatsApp Business gratuito y una hoja de cálculo; lo probaron esa misma semana con 10 clientes reales.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <!-- Marco exterior verde con amplio margen -->\n                  <rect x=\"25\" y=\"20\" width=\"250\" height=\"135\" rx=\"8\" fill=\"#ffffff\" stroke=\"#10b981\" stroke-width=\"2\"/>\n                  <line x1=\"25\" y1=\"55\" x2=\"275\" y2=\"55\" stroke=\"#e2e8f0\" stroke-width=\"1.5\"/>\n                  \n                  <!-- Semáforo de puntos -->\n                  <circle cx=\"48\"           "title": "INTELIGENCIA ARTIFICIAL FACTUAL Y RIGOR DE MERCADO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Fundamento Metodológico:</strong> No usamos la IA para generar textos de relleno o imágenes cosméticas para redes sociales. La empleamos como auditor implacable de datos, sintetizador de papers científicos y evaluador escéptico de viabilidad técnica y financiera.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>La IA como Evaluador Crítico:</strong><br>\n                  Permite simular contrapartes difíciles (clientes exigentes, tenderos escépticos) antes de gastar recursos reales.<br>\n                  <em>Prompt sugerido:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Hazme 5 preguntas demoledoras sobre por qué seguiría comprando por WhatsApp y no en la tienda de enfrente.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  La IA analizó las reseñas de 15 tiendas similares en redes y los datos del propio cuaderno de Sofía: el 80% de los mensajes son las mismas 5 preguntas, y la mayoría de las ventas perdidas fueron por no tener el producto o por no entregar a tiempo.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path d=\"M 35,130 Q 95,30 155,90 T 265,50\" fill=\"none\" stroke=\"#ff622b\" stroke-width=\"3\"/>\n                  <circle cx=\"155\" cy=\"90\" r=\"7\" fill=\"#1f00ff\"/>\n                  <circle cx=\"265\" cy=\"50\" r=\"7\" fill=\"#10b981\"/>\n                  <line x1=\"35\" y1=\"130\" x2=\"265\" y2=\"130\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"         "detail": {
          "tag": "FASE 1 • GENERA TU RETO",
          "title": "FASE G: IDENTIFICAR EL PROBLEMA QUE IMPORTA",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Propósito Metodológico:</strong><br>\n                  El primer paso para cambiar el mundo es identificar qué problema quieres resolver.\n                  <br>• <strong>Paso A (Empatiza):</strong> Entrevistas cortas (~20 min) y observación no invasiva ('Mosca en la pared').\n                  <br>• <strong>Paso B (Imagina escenarios):</strong> Prospectiva a 3-5 años ('¿Cómo imaginas que será [tema] en [comunidad] dentro de [tiempo]?').\n                  <br>• <strong>Paso C (Define el reto):</strong> Formulación de la pregunta canónica HMW.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Tips de Prompts Sugeridos:</strong><br>\n                  • <em>Prompt de Investigación:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Genera una lista de preguntas valiosas para entender mejor por qué la Tienda El Triunfo pierde pedidos y olvida cobrar deudas a fin de mes, enfocadas en causas, efectos, actores clave (Don Hernando, Sofía, clientes fiados, proveedores) y puntos ciegos.'</div><br>\n                  • <em>Prompt de Observación:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Genera una lista de qué actores, roles, comportamientos e interacciones podría observar en la Tienda El Triunfo (tienda de barrio del Eje Cafetero) durante un sábado de alta afluencia: Sofía en el mostrador y el WhatsApp, Don Hernando en domicilios, clientes fiados, proveedores que llegan a surtir.'</div>\n                </div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/ vg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <circle cx=\"150\" cy=\"80\" r=\"48\" fill=\"#f0fdf4\" stroke=\"#10b981\" stroke-width=\"2.5\"/>\n                  <text x=\"150\" y=\"90\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"44\" fill=\"#10b981\">N</text>\n                  <rect x=\"40\" y=\"140\" width=\"220\" height=\"26\" rx=\"5\" fill=\"#10b981\"/>\n                  <text x=\"150\" y=\"157\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#fff\">FASE 3: NUEVAS IDEAS</text>\n                </svg>\n                <span class=\"graphic-caption\">IDEACIÓN SISTEMÁTICA Y FILTRADO</span>\n              </div>\n            </div>\n          "

          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Propósito Metodológico:</strong><br>\n                  No se trata de crear algo perfecto en el primer intento, sino de aprender y mejorar con cada versión.\n                  <br>• <strong>Las 3 clases:</strong> Físicos (maquetas cotidianas), Digitales (wireframes) y Experienciales (juego de roles/servicio).\n                  <br>• <strong>Los 4 pasos:</strong> Elige qué prototipar &rarr; Crea &rarr; Prueba con usuarios &rarr; Itera y mejora.\n                  <br>• <strong>Mago de Oz:</strong> Probar la respuesta humana antes de escribir código.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Tips de Prompts Sugeridos:</strong><br>\n                  • <em>Prompt de Visualización:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Describe una imagen fotorealista de un prototipo construido con cartón, cinta, un celular Android básico viejo y una hoja impresa, que cumpla la función de registrar pedidos de WhatsApp y responder las 5 preguntas frecuentes (precio, existencia, horario, domicilios, medios de pago), en la Tienda El Triunfo de un municipio cafetero colombiano, con luz natural de mañana, estilo fotografía de catálogo.'</div><br>\n                  • <em>Prompt de Feedback:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Analiza las notas de campo de la prueba del Mago de Oz de Vitrina en la Tienda El Triunfo (una tarde respondiendo manualmente los mensajes de WhatsApp como si fuera automático) y genera una lista de mejoras prioritarias: confirmar marca y dirección en el primer mensaje, asignar número de pedido visible, y responder automáticamente fuera de horario.'</div>\n                </div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <circle cx=\"150\" cy=\"80\" r=\"48\" fill=\"#fdf4ff\" stroke=\"#c026d3\" stroke-width=\"2.5\"/>\n                  <text x=\"150\" y=\"90\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"44\" fill=\"#c026d3\">I</text>\n                  <rect x=\"40\" y=\"140\" width=\"220\" height=\"26\" rx=\"5\" fill=\"#c026d3\"/>\n                  <text x=\"150\" y=\"157\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#fff\">FASE 4: INVENTA TU PROTOTIPO</text>\n                </svg>\n                <span class=\"graphic-caption\">MATERIALIZACIÓN Y TESTING EN CAMPO</span>\n              </div>\n            </div>\n          "

          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Propósito Metodológico:</strong><br>\n                  No basta con tener una gran idea: hay que compartirla, comunicarla y hacerla sostenible en el tiempo.\n                  <br>• <strong>Plan de evolución:</strong> 5 metas mensuales claras con métricas y responsables.\n                  <br>• <strong>Sparring con IA:</strong> Simular clientes exigentes para fortalecer la propuesta.\n                  <br>• <strong>El Pitch en 6 pasos:</strong> 1. Motivación &rarr; 2. Evidencia &rarr; 3. La Idea &rarr; 4. Proceso Maker &rarr; 5. Tracción &rarr; 6. Visión y Llamado.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Tips de Prompts Sugeridos:</strong><br>\n                  • <em>Prompt de Sparring Crítico:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Hazme 5 preguntas demoledoras sobre el modelo de negocio de Vitrina para la Tienda El Triunfo: 1) ¿Cuánto cuesta realmente mantenerlo cada mes después de los $120.000 COP iniciales?, 2) ¿Qué pasa si Sofía deja de pagar porque un mes no le cuadró?, 3) ¿Por qué un tendero vecino copiaría la idea en vez de pagarles?, 4) ¿Qué pasa cuando el celular del negocio se queda sin datos a mitad de semana?, 5) ¿Quién responde si el asistente da un precio equivocado y el cliente se molesta?'</div><br>\n                  • <em>Prompt de Pitch:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Evalúa la claridad persuasiva de este guion de pitch de 3 minutos sobre Vitrina para la Tienda El Triunfo (Don Hernando y Sofía, tienda de barrio del Eje Cafetero, 4 pedidos perdidos y $180.000 sin cobrar el mes pasado, probado con 9 de 10 pedidos entregados bien) y optimiza las frases de apertura (gancho humano) y cierre (llamado a la acción: aliados para 10 tiendas del municipio).'</div>\n                </div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <circle cx=\"150\" cy=\"80\" r=\"48\" fill=\"#eff6ff\" stroke=\"#2563eb\" stroke-width=\"2.5\"/>\n                  <text x=\"150\" y=\"90\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"44\" fill=\"#2563eb\">A</text>\n                  <rect x=\"40\" y=\"140\" width=\"220\" height=\"26\" rx=\"5\" fill=\"#2563eb\"/>\n                  <text x=\"150\" y=\"157\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#fff\">FASE 5: APLICA TU SOLUCIÓN</text>\n                </svg>\n                <span class=\"graphic-caption\">IMPLEMENTACIÓN Y SOSTENIBILIDAD</span>\n              </div>\n            </div>\n          "

        "detail": {
          "tag": "FASE E • PASO 1.1 • ESTADO DEL ARTE",
          "title": "1. INVESTIGACIÓN DE ANTECEDENTES Y SOLUCIONES GLOBALES",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Para diseñar una solución innovadora, primero hay que entender qué se ha dicho, estudiado o probado antes sobre el tema. No solo se trata de buscar información directa, sino de analizar factores circundantes: normativas, tendencias y fallas históricas de soluciones previas.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Copiloto de Investigación):</strong><br>\n                  • <em>Prompt de Benchmarking:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Realiza un benchmark exhaustivo de las últimas 5 innovaciones tecnológicas o metodológicas para resolver el problema de pedidos olvidados y deudas sin cobrar en tiendas de barrio que venden por WhatsApp en Colombia y Latinoamérica. Detalla: mecanismo (catálogos de WhatsApp Business, chatbots, hojas de cálculo compartidas, apps de inventario), costo estimado en COP, causas de adopción y causas de fracaso.'</div><br>\n                  • <em>Prompt de Normativa:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Identifica regulaciones, estándares y barreras legales aplicables a un asistente de ventas por WhatsApp con IA para tiendas de barrio en Colombia: protección de datos de clientes (Ley 1581 de 2012), comercio electrónico, y normas de facturación electrónica para pequeños comercios.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Se revisaron las soluciones que ya existen (los catálogos de WhatsApp Business, las tiendas de Instagram, las plataformas para comerciantes pequeños) y tutoriales en video. Hallazgo: las herramientas gratis cubren lo básico, pero ninguna le avisa a Sofía qué producto se le está acabando ni le recuerda cobrar una deuda.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"20\" y=\"25\" width=\"260\" height=\"135\" rx=\"8\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1.5\"/>\n                  <rect x=\"35\" y=\"40\" width=\"70\" height=\"42\" rx=\"4\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"70\" y=\"66\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#1f00ff\">PAPERS</text>\n                  <rect x=\"115\" y=\"40\" width=\"70\" height=\"42\" rx=\"4\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"66\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#1f00ff\">PATENTES</text>\n                  <rect x=\"195\" y=\"40\" width=\"70\" height=\"42\" rx=\"4\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <text x=\"230\" y=\"66\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#1f00ff\">REPORTES</text>\n                  \n                  <path d=\"M 70 85 L 150 115 L 230 85\" fill=\"none\" stroke=\"#ff622b\" stroke-width=\"2\" stroke-dasharray=\"4,4\"/>\n                  <circle cx=\"150\" cy=\"115\" r=\"5\" fill=\"#ff622b\"/>\n                  \n                  <rect x=\"45\" y=\"130\" width=\"210\" height=\"22\" rx=\"4\" fill=\"#1f00ff\"/>\n                  <text x=\"150\" y=\"145\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\" letter-spacing=\"0.5\">SÍNTESIS DE AN         "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr10)'><circle cx='88' cy='60' r='28'/><circle cx='88' cy='60' r='28' opacity='0.25' transform='translate(1.3,0.6)'/><ellipse cx='88' cy='60' rx='12' ry='28'/><line x1='60' y1='60' x2='116' y2='60'/><path d='M64 44 Q88 50 112 44'/><path d='M64 76 Q88 70 112 76'/><circle cx='76' cy='48' r='2.5' fill='#1f00ff' stroke='none'/><circle cx='100' cy='72' r='2.5' fill='#1f00ff' stroke='none'/><rect x='126' y='22' width='42' height='18' rx='7'/><polygon points='134,40 130,50 144,40'/><circle cx='138' cy='31' r='1.8' fill='#3a3a3a' stroke='none'/><circle cx='147' cy='31' r='1.8' fill='#3a3a3a' stroke='none'/><circle cx='156' cy='31' r='1.8' fill='#3a3a3a' stroke='none'/><g stroke='#1f00ff'><rect x='118' y='68' width='36' height='16' rx='7'/><polygon points='126,84 122,93 136,84'/></g><circle cx='129' cy='76' r='1.6' fill='#1f00ff' stroke='none'/><circle cx='137' cy='76' r='1.6' fill='#1f00ff' stroke='none'/><circle cx='145' cy='76' r='1.6' fill='#1f00ff' stroke='none'/></g><clipPath id='fr10'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

        "detail": {
          "tag": "FASE E • PASO 1.2 • NETNOGRAFÍA",
          "title": "2. NETNOGRAFÍA: RASTREO DE VOCES EN COMUNIDADES DIGITALES",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  El mundo digital es un reflejo de lo que sucede en la realidad. La netnografía permite observar cómo las personas se expresan, interactúan y generan tendencias en comunidades virtuales (grupos de Facebook, hilos de Reddit, foros de gremios, canales de WhatsApp y comentarios en YouTube).\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Minería de Sentimientos y Quejas):</strong><br>\n                  • <em>Prompt de Extracción Netnográfica:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'He recopilado estos comentarios de tenderos del municipio en grupos de WhatsApp y Facebook: \"se me olvidó entregarle a la señora del corner y me bloqueó\", \"llevo los fiados en la cabeza y a fin de mes no me cuadra\", \"me da pena cobrarle a los clientes de toda la vida\", \"el cuaderno se me mojó y se borró la deuda\", \"respondo los mensajes cuando puedo, entre fila y fila\". Analízalos y clasifícalos en: a) Frustraciones recurrentes no resueltas (pedidos olvidados, deudas sin cobrar), b) Soluciones caseras que ya usan (libreta aparte, memoria, WhatsApp Business básico), c) Emociones dominantes (ansiedad, resignación, desconfianza hacia la tecnología).'</div><br>\n                  • <em>Fórmula GENIA:</em> Conectar la queja emocional con el dato técnico para descubrir la brecha.\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Rastreo en grupos de Facebook y WhatsApp de tenderos del municipio: \"se me olvidó entregarle a la señora del corner y me bloqueó\", \"llevo los fiados en la cabeza y a fin de mes no me cuadra\". Más de 30 menciones de lo mismo: pedidos olvidados y deudas sin cobrar.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"25\" y=\"20\" width=\"250\" height=\"145\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#e9d5ff\" stroke-width=\"1.5\"/>\n                  <circle cx=\"75\" cy=\"65\" r=\"28\" fill=\"#f3e8ff\" stroke=\"#7c3aed\" stroke-width=\"2\"/>\n                  <text x=\"75\" y=\"70\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#7c3aed\">FOROS</text>\n                  \n                  <circle cx=\"225\" cy=\"65\" r=\"28\" fill=\"#f3e8ff\" stroke=\"#7c3aed\" stroke-width=\"2\"/>\n                  <text x=\"225\" y=\"70\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#7c3aed\">REDES</text>\n                  \n                  <path d=\"M 105 65 L 195 65\" stroke=\"#ff622b\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n                  <polygon points=\"190,60 200,65 190,70\" fill=\"#ff622b\"/>\n                  \n                  <rect x=\"50\" y=\"115\" width=\"200\" height=\"34\" rx=\"6\" fill=\"#7c3aed\"/>\n                  <text x=\"150\" y=\"130\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#ffffff\">CLÚSTERES DE INSATISFACCIÓN</text>\n                  <text x=\"150\" y=\"142\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#ddd6fe\">FRUSTRACIONES Y PARCHES CASEROS</text>\n                </svg>\n                <span class=\"graphic-caption\">MAPEO NETNOGRÁFICO DE CONVERSACIONES</span>\n              </div>\n            </div>\n          "

        "title": "MAPA DE ACTORES Y SISTEMA",
        "body": "Mapeo de influencia versus cercanía al problema: usuarios directos, habilitadores, compradores y reguladores.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr11)'><circle cx='100' cy='58' r='36' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='3 4'/><circle cx='100' cy='58' r='24'/><circle cx='100' cy='58' r='12'/><circle cx='100' cy='58' r='12' opacity='0.25' transform='translate(0.8,0.6)'/><circle cx='100' cy='58' r='4.5' fill='#1f00ff' stroke='none'/><line x1='100' y1='18' x2='100' y2='23'/><line x1='100' y1='93' x2='100' y2='98'/><line x1='60' y1='58' x2='65' y2='58'/><line x1='135' y1='58' x2='140' y2='58'/><line x1='72' y1='30' x2='75.5' y2='33.5'/><line x1='125' y1='82.5' x2='128' y2='86'/><line x1='128' y1='30' x2='124.5' y2='33.5'/><line x1='75' y1='82.5' x2='72' y2='86'/><text x='100' y='14' font-family='cursive' font-size='7' fill='#777' stroke='none' text-anchor='middle'>entorno</text></g><clipPath id='fr11'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [

        "detail": {
          "tag": "FASE E • PASO 1.3 • MAPA DE ACTORES",
          "title": "3. MAPA DE ACTORES: PODER, INFLUENCIA Y RELACIONES",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Antes de entrevistar, necesitas identificar a las personas o grupos más relevantes con un Mapa de Actores. Clasifica quiénes viven el problema en carne propia (núcleo), quiénes toman decisiones técnicas o económicas (influencia) y quiénes regulan o compran (entorno exterior).\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Ecosistema y Puntos Ciegos):</strong><br>\n                  • <em>Prompt de Descubrimiento de Actores:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Para el reto HMW \"¿Cómo podríamos lograr que la Tienda El Triunfo atienda, registre y haga seguimiento de sus ventas por WhatsApp sin que se le olvide nada y sin que Sofía tenga que dejar de atender la tienda?\", lista todos los actores que influyen: Don Hernando y Sofía (centro), los 30 clientes recurrentes del barrio y los 12 clientes fiados (usuarios directos), los proveedores que surten la tienda (habilitadores), otros tenderos del municipio y el programa de digitalización de la alcaldía (validadores), y la familia que ayuda sin cobrar (actores invisibles).'</div><br>\n                  • <em>Prompt de Preguntas por Rol:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Genera 5 preguntas con foco técnico para el contador del municipio (experto en deudas de tiendas de barrio y WhatsApp Business) y 5 preguntas con foco vivencial para Sofía (usuaria directa que atiende el WhatsApp de la Tienda El Triunfo mientras atiende la fila): ¿qué le duele más de anotar pedidos en un cuaderno? ¿Cuántas veces se le ha caído el cuaderno? ¿Qué hace cuando le escriben 40 mensajes en un día?'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Tres círculos concéntricos: Don Hernando y Sofía (centro); clientes del barrio y proveedores (habilitadores); otros tenderos del municipio y programas de digitalización de la alcaldía (validadores).</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <circle cx=\"150\" cy=\"85\" r=\"70\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\"/>\n                  <circle cx=\"150\" cy=\"85\" r=\"48\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <circle cx=\"150\" cy=\"85\" r=\"26\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"2.5\"/>\n                  <text x=\"150\" y=\"89\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ff622b\">USUARIO</text>\n                  \n                  <text x=\"150\" y=\"48\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"600\" font-size=\"8\" fill=\"#475569\">HABILITADORES TÉCNICOS</text>\n                  <text x=\"150\" y=\"24\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"600\" font-size=\"8\" fill=\"#64748b\">ENTORNO Y COMPRADORES</text>\n                  \n                  <rect x=\"40\" y=\"152\" width=\"220\" height=\"20\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"165\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#f8fafc\">MATRIZ RADIAL DE INFLUENCIA Y ADOPCIÓN</text>\n                </svg>\n                <span class=\"graphic-caption\">MAPA CONCÉNTRICO DEL ECOSISTEMA DE ACTORES</span>\n              </div>\n            </div>\n          "
        }
      }

    "rigor": "EXPLORACIÓN RIGUROSA: No se aceptan soluciones precipitadas sin haber mapeado el estado del arte y los actores del sistema."

      {
        "num": "01",
        "title": "ETNOGRAFÍA ACTIVA Y PASIVA",
        "body": "Inmersión en el entorno natural: observación 'mosca en la pared' sin intervenir y participación guiada con diarios de campo.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr12)'><path d='M50 60 Q100 26 150 60 Q100 94 50 60 Z'/><path d='M50 60 Q100 26 150 60 Q100 94 50 60 Z' opacity='0.25' transform='translate(1,1)'/><g stroke='#1f00ff'><circle cx='100' cy='60' r='14'/></g><circle cx='100' cy='60' r='6' fill='#3a3a3a' stroke='none'/><line x1='70' y1='44' x2='65' y2='38'/><line x1='85' y1='37' x2='82' y2='30'/><line x1='100' y1='35' x2='100' y2='27'/><line x1='115' y1='37' x2='118' y2='30'/><line x1='130' y1='44' x2='135' y2='38'/><circle cx='88' cy='55' r='1.5' fill='#1f00ff' stroke='none'/></g><clipPath id='fr12'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [
          "Observación",
          "Mosca en Pared",
          "Diario de Campo"
        ],
        "detail": {
          "tag": "FASE E • PASO 2.1 • ETNOGRAFÍA",
          "title": "1. OBSERVACIÓN IN SITU: LO QUE LA GENTE HACE VS LO QUE DICE",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  La etnografía es el método que estudia dinámicas sociales a través de la observación profunda en su entorno natural. Hay dos formas clave:<br>\n                  • <em>Pasiva ('Mosca en la pared'):</em> Mirar sin intervenir para captar hábitos inconscientes, silencios y pausas.<br>\n                  • <em>Activa (Acompañamiento):</em> Hacer la tarea junto al usuario ('shadowing') para sentir el esfuerzo físico y mental.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Sistematización de Notas de Campo):</strong><br>\n                  • <em>Prompt de Análisis Etnográfico:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Aquí están mis notas desordenadas de 6 horas de observación en la Tienda El Triunfo: \"8:15 a.m. Sofía abre la tienda y lo primero que hace es revisar el WhatsApp, 12 mensajes sin leer\", \"9:40 a.m. atiende fila de 4 personas y deja el celular boca abajo\", \"11:20 a.m. anota un pedido en el cuaderno, la letra se ve borrosa por humedad\", \"1:00 p.m. dice yo ya sé quién me debe, eso está en mi cabeza pero tarda 12 min buscando en la libreta\", \"3:15 p.m. copia mal una dirección y el pedido no se entrega\", \"6:00 p.m. 6 mensajes sin responder, clientes se fueron a la tienda de enfrente\". Identifica: 1) Hábitos automatizados no conscientes (dejar el celular boca abajo, anotar sin verificar), 2) Micro-fricciones físicas (cuaderno que se moja, letra que se borra, libreta difícil de consultar), 3) Desfases entre lo que Sofía declara (todo está en mi cabeza) y lo que ejecuta (tarda 12 min buscando).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  En la entrevista Sofía dijo \"yo ya sé quién me debe, eso está en mi cabeza\". Al observarla en silencio una tarde, tardó 12 minutos buscando en la libreta cuánto le debía un cliente porque la letra se había borrado con la humedad.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"25\" y=\"20\" width=\"115\" height=\"110\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#1f00ff\" stroke-width=\"1.5\"/>\n                  <circle cx=\"82\" cy=\"50\" r=\"16\" fill=\"#1f00ff\"/>\n                  <text x=\"82\" y=\"55\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#ffffff\">👁️</text>\n                  <text x=\"82\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#1f00ff\">PASIVA</text>\n                  <text x=\"82\" y=\"96\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#475569\">Mosca en pared</text>\n                  <text x=\"82\" y=\"110\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#64748b\">Cero alteración</text>\n\n                  <rect x=\"160\" y=\"20\" width=\"115\" height=\"110\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <circle cx=\"217\" cy=\"50\" r=\"16\" fill=\"#ff622b\"/>\n                  <text x=\"217\" y=\"55\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"11\" fill=\"#ffffff\">🤝</text>\n                  <text x=\"217\" y=\"80\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"10\" fill=\"#ff622b\">ACTIVA</text>\n                  <text x=\"217\" y=\"96\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#475569\">Shadowing en vivo</text>\n                  <text x=\"217\" y=\"110\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#64748b\">Vivir el proceso</text>\n\n                  <rect x=\"35\" y=\"145\" width=\"230\" height=\"24\" rx=\"4\" fill=\"#0f172a\"/>\n                  <text x=\"150\" y=\"161\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\">REGISTRO RIGUROSO EN DIARIO DE CAMPO</text>\n                </svg>\n                <span class=\"graphic-caption\">MODALIDADES DE OBSERVACIÓN ETNOGRÁFICA</span>\n              </div>\n            </div>\n          "
        }
      },
      {
        "num": "02",
        "title": "MAPA DE RECORRIDO (JOURNEY)",
        "body": "Cronograma vivencial paso a paso: acciones físicas, puntos de contacto, emociones, dudas y caídas de energía.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr13)'><line x1='24' y1='90' x2='176' y2='90' stroke='#a8a8a8' stroke-width='1' stroke-dasharray='3 3'/><path d='M28 76 C 58 30, 88 92, 118 50 S 160 60, 170 38'/><path d='M28 76 C 58 30, 88 92, 118 50 S 160 60, 170 38' opacity='0.25' transform='translate(1,1)'/><circle cx='28' cy='76' r='4'/><circle cx='72' cy='64' r='4'/><circle cx='118' cy='50' r='4'/><g stroke='#1f00ff'><circle cx='170' cy='38' r='4.5'/><line x1='170' y1='38' x2='170' y2='22'/></g><polygon points='170,22 182,26 170,30' fill='#1f00ff' stroke='none'/><text x='72' y='80' font-family='cursive' font-size='9' fill='#10b981' stroke='none' text-anchor='middle'>+</text><text x='118' y='64' font-family='cursive' font-size='9' fill='#e05252' stroke='none' text-anchor='middle'>-</text></g><clipPath id='fr13'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [
          "Journey Map",
          "Puntos de Dolor",
          "Curva Emocional"
        ],
        "detail": {
          "tag": "FASE E • PASO 2.2 • MAPA DE RECORRIDO",
          "title": "2. MAPA DE RECORRIDO DEL USUARIO (JOURNEY MAP)",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  El mapa de recorrido te ayuda a entender cómo una persona se mueve dentro de un espacio, qué lugares visita, en qué orden y por qué. Permite graficar la curva emocional: los momentos cumbre de satisfacción versus los valles de angustia, duda y frustración.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Estructuración del Journey):</strong><br>\n                  • <em>Prompt de Journey Map:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'A partir de este relato de Sofía en la Tienda El Triunfo: \"Abro la tienda a las 7, surto la nevera, atiendo la fila de la mañana, reviso el WhatsApp entre cliente y cliente, anoto los pedidos en el cuaderno, a veces se me olvida copiar la dirección completa, y a las 8 de la noche llega un reclamo de un pedido que nunca llegó\". Construye una tabla cronológica con 5 columnas: 1) Fase temporal (7:00 a.m. a 8:00 p.m.), 2) Acción física observable, 3) Emoción sentida (escala -2 a +2), 4) Punto de fricción o dolor, 5) Oportunidad de intervención (ej: a las 8:00 p.m. el valle emocional más bajo, oportunidad de aviso automático de pedido no entregado).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Abrir la tienda → surtir la nevera → atender la fila → revisar el WhatsApp → anotar el pedido en el cuaderno → olvidar copiar la dirección → reclamo al día siguiente. El valle emocional más profundo es a las 8:00 p.m., cuando un cliente reclama un pedido que nunca llegó.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <line x1=\"30\" y1=\"90\" x2=\"270\" y2=\"90\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n                  <text x=\"270\" y=\"85\" text-anchor=\"end\" font-family=\"Archivo\" font-size=\"8\" fill=\"#94a3b8\">Línea Neutra</text>\n\n                  <polyline points=\"45,60 95,50 150,135 205,80 255,145\" fill=\"none\" stroke=\"#ff622b\" stroke-width=\"2.5\"/>\n                  <circle cx=\"45\" cy=\"60\" r=\"4\" fill=\"#1f00ff\"/>\n                  <circle cx=\"95\" cy=\"50\" r=\"4\" fill=\"#1f00ff\"/>\n                  <circle cx=\"150\" cy=\"135\" r=\"6\" fill=\"#ef4444\"/>\n                  <circle cx=\"205\" cy=\"80\" r=\"4\" fill=\"#1f00ff\"/>\n                  <circle cx=\"255\" cy=\"145\" r=\"6\" fill=\"#ef4444\"/>\n\n                  <text x=\"45\" y=\"42\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Pedido</text>\n                  <text x=\"95\" y=\"32\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Surtido</text>\n                  <text x=\"150\" y=\"156\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8\" fill=\"#ef4444\">¡Valle: Madrugada!</text>\n                  <text x=\"205\" y=\"68\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#475569\">Entrega</text>\n                  <text x=\"255\" y=\"166\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8\" fill=\"#ef4444\">¡Valle: Liquidación!</text>\n                </svg>\n                <span class=\"graphic-caption\">CURVA EMOCIONAL Y VALLES CRÍTICOS DE DOLOR</span>\n              </div>\n            </div>\n          "
        }

      {
        "num": "03",
        "title": "MATRIZ 2X2 DE PRIORIZACIÓN",
        "body": "Cruce de variables ortogonales (Frecuencia vs Severidad, o Facilidad vs Impacto) para focalizar el esfuerzo.",
        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr14)'><rect x='44' y='20' width='112' height='76'/><rect x='44' y='20' width='112' height='76' opacity='0.25' transform='translate(1.2,-0.8)'/><line x1='100' y1='20' x2='100' y2='96' stroke='#a8a8a8' stroke-width='1'/><line x1='44' y1='58' x2='156' y2='58' stroke='#a8a8a8' stroke-width='1'/><circle cx='72' cy='38' r='4' fill='#1f00ff' stroke='none'/><circle cx='128' cy='36' r='4'/><circle cx='126' cy='80' r='4'/><line x1='44' y1='104' x2='156' y2='104'/><polygon points='156,104 148,100 148,108' fill='#3a3a3a' stroke='none'/><line x1='36' y1='96' x2='36' y2='24'/><polygon points='36,24 32,32 40,32' fill='#3a3a3a' stroke='none'/><text x='100' y='114' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>matriz 2x2</text></g><clipPath id='fr14'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",
        "tags": [
          "Matriz 2x2",
          "Priorización"
        ],
        "detail": {
          "tag": "FASE E • PASO 2.3 • MATRIZ 2X2",
          "title": "3. MATRIZ 2X2: ORGANIZACIÓN Y PRIORIZACIÓN DE DATOS",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  La Matriz 2x2 es una herramienta sencilla pero poderosa que permite organizar y priorizar la información visualmente. Al cruzar dos dimensiones críticas (ej. Impacto en el usuario vs Complejidad de resolución), el equipo evita discutir opiniones y toma decisiones basadas en evidencia.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Herramientas Visuales y Matrices):</strong><br>\n                  • <em>Prompt de Priorización:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Aquí tengo 8 dolores observados en la Tienda El Triunfo: 1) 4 pedidos no entregados el mes pasado por dirección mal copiada, 2) $180.000 COP sin cobrar a 3 clientes fiados, 3) 32 de 40 mensajes diarios son las mismas 5 preguntas, 4) Se les acaba el arroz y el pan los fines de semana, 5) Sobran productos perecederos, 6) Sofía tarda 12 min buscando una deuda en la libreta, 7) 6 mensajes sin responder a las 7:00 p.m., 8) Un cliente se fue a la competencia por un pedido olvidado. Asígnales puntuación de 1 a 10 en Severidad del Daño y Frecuencia. Ubícalos en 4 cuadrantes: el cuadrante superior derecho (alta severidad + alta frecuencia) debe quedar con los pedidos olvidados y las deudas sin cobrar.'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Caso Aplicado (Don Hernando y Sofía):</strong>\n                  Cuadrante superior derecho (alta severidad + alta frecuencia): los pedidos olvidados ocurren casi cada semana y duelen porque el cliente se va a comprar a la tienda de enfrente.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"150\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n                  <line x1=\"30\" y1=\"85\" x2=\"270\" y2=\"85\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n\n                  <text x=\"150\" y=\"15\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#1f00ff\">▲ ALTO IMPACTO</text>\n                  <text x=\"150\" y=\"165\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#64748b\">▼ BAJO IMPACTO</text>\n                  <text x=\"28\" y=\"88\" text-anchor=\"end\" font-family=\"Archivo\" font-size=\"7.5\" fill=\"#64748b\">DIFÍCIL ◄</text>\n                  <text x=\"272\" y=\"88\" text-anchor=\"start\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"7.5\" fill=\"#ff622b\">► FÁCIL</text>\n\n                  <rect x=\"165\" y=\"28\" width=\"95\" height=\"50\" rx=\"6\" fill=\"#fff7ed\" stroke=\"#ff622b\" stroke-width=\"1.5\"/>\n                  <text x=\"212\" y=\"50\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"9\" fill=\"#ff622b\">ZONA DE ORO</text>\n                  <text x=\"212\" y=\"66\" text-anchor=\"middle\" font-family=\"Archivo\" font-size=\"8\" fill=\"#475569\">ALTO IMPACTO + VIABLE</text>\n                  <circle cx=\"230\" cy=\"40\" r=\"4\" fill=\"#ff622b\"/>\n                </svg>\n                <span class=\"graphic-caption\">CUADRANTE DE PRIORIZACIÓN ESTRATÉGICA 2X2</span>\n              </div>\n            </div>\n          "
        }

        "detail": {
          "tag": "MATRIZ CAUSAL • ETAPA 1",
          "title": "1. LA EVIDENCIA EMPÍRICA Y OBJETIVA",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  La evidencia es un hecho comprobado. Se basa en pruebas sólidas y datos verificables que no dependen de la opinión de nadie. Nos dice exactamente qué es cierto en el territorio.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Verificación de Hechos):</strong><br>\n                  • <em>Prompt de Auditoría Factual:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Analiza este reporte de campo de la Tienda El Triunfo, octubre: cuaderno de pedidos muestra 4 direcciones mal copiadas que causaron pedidos no entregados; libreta de fiados muestra $180.000 COP sin cobrar a 3 de 12 clientes; registro de WhatsApp muestra 40 mensajes promedio diarios, 32 con las mismas 5 preguntas; Sofía declara que ella sabe quién le debe pero tardó 12 min buscando en la libreta porque la letra se borró con la humedad. Separa tajantemente: 1) Hechos comprobables con evidencia material (fotos del cuaderno, captura de WhatsApp, montos en la libreta), 2) Suposiciones del equipo (los clientes no vuelven porque no confían).'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Evidencia Caso Práctico:</strong>\n                  En el cuaderno de Sofía, mes de octubre: 4 pedidos sin entregar por dirección mal copiada; en la libreta de fiados: $180.000 COP sin cobrar a 3 clientes; y 40 mensajes diarios promedio, 32 de ellos con las mismas 5 preguntas.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"50\" y=\"22\" width=\"200\" height=\"135\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n                  <rect x=\"70\" y=\"40\" width=\"160\" height=\"16\" rx=\"3\" fill=\"#e2e8f0\"/>\n                  <rect x=\"70\" y=\"65\" width=\"115\" height=\"10\" rx=\"2\" fill=\"#cbd5e1\"/>\n                  <rect x=\"70\" y=\"85\" width=\"145\" height=\"10\" rx=\"2\" fill=\"#cbd5e1\"/>\n                  \n                  <!-- Cápsula de castigo holgada -->\n                  <rect x=\"160\" y=\"102\" width=\"76\" height=\"26\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#ef4444\" stroke-width=\"2\"/>\n                  <text x=\"198\" y=\"119\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"14\" fill=\"#ef4444\" letter-spacing=\"1\">CASTIGO</text>\n                  \n                  <text x=\"150\" y=\"148\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#475569\">RECIBO DE LIQUIDACIÓN PENALIZADO</text>\n                </svg>\n                <span class=\"graphic-caption\">REGISTRO MATERIAL INCONTROVERTIBLE</span>\n              </div>\n            </div>\n"

        "blueprint": "<svg viewBox='0 0 200 120' xmlns='http://www.w3.org/2000/svg'><defs></defs><rect x='6' y='6' width='188' height='104' fill='none' stroke='#c9c9c9' stroke-width='1' stroke-dasharray='2 4'/><path d='M6 14 V6 H14 M186 6 H194 V14 M194 102 V110 H186 M14 110 H6 V102' stroke='#a8a8a8' stroke-width='1.5' fill='none'/><g fill='none' stroke='#3a3a3a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' clip-path='url(#fr16)'><circle cx='40' cy='28' r='2'/><circle cx='64' cy='28' r='2'/><circle cx='88' cy='28' r='2'/><circle cx='112' cy='28' r='2'/><circle cx='136' cy='28' r='2'/><circle cx='160' cy='28' r='2'/><circle cx='40' cy='48' r='2'/><circle cx='64' cy='48' r='2'/><circle cx='88' cy='48' r='2'/><circle cx='112' cy='48' r='2'/><circle cx='136' cy='48' r='2'/><circle cx='160' cy='48' r='2'/><circle cx='40' cy='68' r='2'/><circle cx='64' cy='68' r='2'/><circle cx='88' cy='68' r='2'/><circle cx='112' cy='68' r='2'/><circle cx='136' cy='68' r='2'/><circle cx='160' cy='68' r='2'/><circle cx='40' cy='88' r='2'/><circle cx='64' cy='88' r='2'/><circle cx='88' cy='88' r='2'/><circle cx='112' cy='88' r='2'/><circle cx='136' cy='88' r='2'/><circle cx='160' cy='88' r='2'/><line x1='64' y1='48' x2='112' y2='48'/><line x1='112' y1='48' x2='112' y2='88'/><line x1='112' y1='88' x2='160' y2='88'/><circle cx='64' cy='48' r='3' fill='#1f00ff' stroke='none'/><circle cx='112' cy='48' r='3' fill='#1f00ff' stroke='none'/><circle cx='112' cy='88' r='3' fill='#1f00ff' stroke='none'/><circle cx='160' cy='88' r='3' fill='#1f00ff' stroke='none'/><text x='100' y='108' font-family='cursive' font-size='8' fill='#777' stroke='none' text-anchor='middle'>patrón</text></g><clipPath id='fr16'><rect x='7' y='7' width='186' height='102'/></clipPath></svg>",

          "title": "2. EL DESCUBRIMIENTO: PATRÓN COMPROBADO",
          "html": "\n            <div class=\"modal-split-view\">\n              <div class=\"modal-text-panel\">\n                <div class=\"methodology-block\">\n                  <strong>Metodología Oficial GENIA:</strong><br>\n                  Un descubrimiento conecta varios datos para demostrar que no es un caso aislado sino un fenómeno colectivo. Nos dice con qué frecuencia y en qué condiciones se repite el problema en el grupo social.\n                </div>\n                <div class=\"ai-copilot-block\">\n                  <strong>Asistencialización con IA (Identificación de Patrones):</strong><br>\n                  • <em>Prompt de Detección de Patrones:</em> <div class=\"prompt-console\"><button class=\"prompt-copy-btn\" onclick=\"copyPrompt(event)\" title=\"Copiar prompt\">COPIAR</button>'Aquí hay datos de 10 tiendas similares del municipio: Tienda El Triunfo (4 pedidos perdidos, $180.000 sin cobrar), Tienda La Esquina (2 pedidos perdidos, $95.000 sin cobrar), Tienda Doña Mary (3 pedidos perdidos, $120.000 sin cobrar), y 7 tiendas más con patrones similares de cuaderno + WhatsApp manual. Encuentra correlaciones: ¿el 70% de los mensajes de WhatsApp en todas son las mismas 5 preguntas? ¿Cuántas ventas se pierden al mes por pedidos olvidados en promedio?'</div>\n                </div>\n                <div class=\"case-applied-block\">\n                  <strong>Descubrimiento Caso Práctico:</strong>\n                  El 70% de los clientes de WhatsApp preguntan lo mismo antes de comprar: precio, existencia, domicilios, horario y medios de pago.</div>\n              </div>\n              <div class=\"modal-graphic-panel\">\n                <svg viewBox=\"0 0 300 185\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <rect x=\"40\" y=\"115\" width=\"40\" height=\"35\" rx=\"3\" fill=\"#cbd5e1\"/>\n                  <rect x=\"95\" y=\"90\" width=\"40\" height=\"60\" rx=\"3\" fill=\"#cbd5e1\"/>\n                  <rect x=\"150\" y=\"55\" width=\"40\" height=\"95\" rx=\"3\" fill=\"#cbd5e1\"/>\n                  <rect x=\"205\" y=\"30\" width=\"40\" height=\"120\" rx=\"3\" fill=\"#1f00ff\"/>\n                  \n                  <text x=\"225\" y=\"24\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"14\" fill=\"#1f00ff\">68% AFECTADOS</text>\n                  <line x1=\"30\" y1=\"150\" x2=\"265\" y2=\"150\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n                  <text x=\"150\" y=\"168\" text-anchor=\"middle\" font-family=\"Archivo\" font-weight=\"700\" font-size=\"8.5\" fill=\"#475569\">PEDIDOS OLVIDADOS POR MES</text>\n                </svg>\n                <span class=\"graphic-caption\">PEDIDOS PERDIDOS EN EL BARRIO</span>\n              </div>\n            </div>\n          "
        }
